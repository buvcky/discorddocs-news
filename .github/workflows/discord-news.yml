name: Discord Docs News

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest Discord Docs commit
        id: discord
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/discord/discord-api-docs/commits?per_page=1")

          sha=$(echo "$response" | jq -r '.[0].sha')
          message=$(echo "$response" | jq -r '.[0].commit.message' | head -n 1)
          url=$(echo "$response" | jq -r '.[0].html_url')
          date=$(echo "$response" | jq -r '.[0].commit.author.date')

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: ${{ steps.discord.outputs.message }}
          URL: ${{ steps.discord.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg message "$MESSAGE" \
            --arg url "$URL" \
            '{
              content: "📢 **Discord Developer Docs Updated**\n\n\($message)\n\n🔗 \($url)"
            }')

          echo "Sending notification to Discord..."

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"

          echo "Discord notification sent successfully."
