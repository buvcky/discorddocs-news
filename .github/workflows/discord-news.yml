name: Discord Webhook V2 Test

on:
  workflow_dispatch:

jobs:
  test-webhooks:
    runs-on: ubuntu-24.04

    steps:
      - name: Test all Discord webhooks
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -u

          send_test() {
            local name="$1"
            local webhook="$2"

            echo ""
            echo "========================================"
            echo "Testing: $name"
            echo "========================================"

            if [ -z "$webhook" ]; then
              echo "ERROR: Secret is empty: $name"
              return 1
            fi

            payload='{
              "flags": 32768,
              "components": [
                {
                  "type": 10,
                  "content": "Discord Components V2 test"
                }
              ]
            }'

            response=$(curl -sS \
              -X POST \
              "${webhook}?with_components=true&wait=true" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              -w "\nHTTP_STATUS:%{http_code}" \
              2>&1)

            status=$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS://p')
            body=$(printf '%s\n' "$response" | sed '/^HTTP_STATUS:/d')

            echo "HTTP status: $status"
            echo "Discord response:"
            echo "$body"

            if [ "$status" != "200" ]; then
              echo "FAILED: $name"
              return 1
            fi

            echo "SUCCESS: $name"
            return 0
          }

          failed=0

          send_test "WEBHOOK_API" "$WEBHOOK_API" || failed=1
          send_test "WEBHOOK_BREAKING" "$WEBHOOK_BREAKING" || failed=1
          send_test "WEBHOOK_CHANGELOG" "$WEBHOOK_CHANGELOG" || failed=1
          send_test "WEBHOOK_DEVELOPER_NEWS" "$WEBHOOK_DEVELOPER_NEWS" || failed=1
          send_test "WEBHOOK_DOCS" "$WEBHOOK_DOCS" || failed=1
          send_test "WEBHOOK_PATCH_NOTES" "$WEBHOOK_PATCH_NOTES" || failed=1
          send_test "WEBHOOK_SOCIAL_SDK" "$WEBHOOK_SOCIAL_SDK" || failed=1

          echo ""
          echo "========================================"

          if [ "$failed" -ne 0 ]; then
            echo "One or more webhooks FAILED."
            exit 1
          fi

          echo "ALL WEBHOOKS PASSED."
