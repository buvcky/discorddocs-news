name: Discord Official News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  discord-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-state-${{ github.run_id }}
          restore-keys: |
            discord-news-state-

      - name: Discover official updates
        run: |
          cat > discover.py <<'PY'
          import json
          import re
          import urllib.request
          import urllib.parse
          import html

          UA = "DiscordDocsNews/2.0"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": UA}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          def clean(value):
              value = html.unescape(value or "")
              value = re.sub(
                  r"<script.*?</script>",
                  " ",
                  value,
                  flags=re.S | re.I
              )
              value = re.sub(
                  r"<style.*?</style>",
                  " ",
                  value,
                  flags=re.S | re.I
              )
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def page_info(url):
              raw = get(url)

              title = ""
              image = ""

              m = re.search(
                  r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)',
                  raw,
                  re.I
              )
              if m:
                  title = html.unescape(m.group(1)).strip()

              if not title:
                  m = re.search(
                      r'<title[^>]*>(.*?)</title>',
                      raw,
                      re.S | re.I
                  )
                  if m:
                      title = clean(m.group(1))

              m = re.search(
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                  raw,
                  re.I
              )
              if m:
                  image = html.unescape(m.group(1)).strip()

              if image.startswith("/"):
                  image = "https://discord.com" + image

              text = clean(raw)

              return {
                  "title": title,
                  "image": image,
                  "text": text
              }

          def find_links(raw, pattern):
              found = re.findall(pattern, raw, re.I)
              result = []

              for url in found:
                  url = html.unescape(url)
                  url = url.rstrip(".,)")
                  if url not in result:
                      result.append(url)

              return result

          sources = {}

          try:
              blog = get("https://discord.com/blog")
          except Exception:
              blog = ""

          try:
              patch = get("https://discord.com/tags/patch-notes")
          except Exception:
              patch = ""

          try:
              newsletter = get(
                  "https://discord.com/developers/developer-newsletter"
              )
          except Exception:
              newsletter = ""

          changelog_links = find_links(
              blog,
              r'https://discord\.com/blog/discord-update-[^"\'<>\s]+'
          )

          if changelog_links:
              url = changelog_links[0]

              try:
                  info = page_info(url)

                  sources["changelog"] = {
                      "found": True,
                      "title": info["title"][:250],
                      "description": info["text"][:1800],
                      "source": "Discord Blog",
                      "type": "Changelog",
                      "url": url,
                      "image": info["image"]
                  }
              except Exception:
                  sources["changelog"] = {"found": False}
          else:
              sources["changelog"] = {"found": False}

          patch_links = find_links(
              patch,
              r'https://discord\.com/blog/discord-patch-notes-[^"\'<>\s]+'
          )

          if patch_links:
              url = patch_links[0]

              try:
                  info = page_info(url)

                  sources["patch_notes"] = {
                      "found": True,
                      "title": info["title"][:250],
                      "description": info["text"][:1800],
                      "source": "Discord Patch Notes",
                      "type": "Patch Notes",
                      "url": url,
                      "image": info["image"]
                  }
              except Exception:
                  sources["patch_notes"] = {"found": False}
          else:
              sources["patch_notes"] = {"found": False}

          newsletter_links = find_links(
              newsletter,
              r'https://discord\.com/developer-newsletter/[^"\'<>\s]+'
          )

          if newsletter_links:
              url = newsletter_links[0]

              try:
                  info = page_info(url)

                  sources["developer_news"] = {
                      "found": True,
                      "title": info["title"][:250],
                      "description": info["text"][:1800],
                      "source": "Discord Developer Newsletter",
                      "type": "Developer News",
                      "url": url,
                      "image": info["image"]
                  }
              except Exception:
                  sources["developer_news"] = {"found": False}
          else:
              sources["developer_news"] = {"found": False}

          def github_commits(path=None, count=10):
              url = (
                  "https://api.github.com/repos/"
                  "discord/discord-api-docs/commits"
              )

              params = {
                  "per_page": str(count)
              }

              if path:
                  params["path"] = path

              url += "?" + urllib.parse.urlencode(params)

              try:
                  data = json.loads(get(url))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          def github_commit(sha):
              url = (
                  "https://api.github.com/repos/"
                  f"discord/discord-api-docs/commits/{sha}"
              )

              try:
                  return json.loads(get(url))
              except Exception:
                  return {}

          def commit_item(commit, category, item_type):
              sha = commit.get("sha", "")
              data = commit.get("commit", {})
              message = data.get("message", "").strip()
              author = (
                  data.get("author", {})
                  .get("name", "Discord")
              )

              if not message:
                  message = "A new official Discord API documentation update was published."

              detail = github_commit(sha)

              files = detail.get("files", [])
              filenames = [
                  f.get("filename", "")
                  for f in files
              ]

              commit_url = (
                  "https://github.com/discord/"
                  f"discord-api-docs/commit/{sha}"
              )

              return {
                  "found": True,
                  "title": message.splitlines()[0][:250],
                  "description": message[:1800],
                  "source": "Discord API Docs",
                  "type": item_type,
                  "url": commit_url,
                  "image": "https://opengraph.githubassets.com/1/"
                          f"discord/discord-api-docs/commit/{sha}",
                  "author": author,
                  "commit": sha[:12],
                  "files": "\n".join(filenames[:20]),
                  "_sha": sha
              }

          api_paths = [
              "developers/reference.mdx",
              "developers/reference",
              "developers/resources",
              "developers/events",
              "developers/topics",
              "developers/components",
              "developers/change-log.mdx"
          ]

          api_commit = None

          for path in api_paths:
              commits = github_commits(path, 5)

              if commits:
                  api_commit = commits[0]
                  break

          if api_commit:
              sources["api"] = commit_item(
                  api_commit,
                  "api",
                  "API Update"
              )
          else:
              sources["api"] = {"found": False}

          docs_commits = github_commits(
              "developers",
              10
          )

          docs_commit = None

          for commit in docs_commits:
              msg = (
                  commit.get("commit", {})
                  .get("message", "")
                  .lower()
              )

              if not any(
                  term in msg
                  for term in [
                      "breaking",
                      "deprecated",
                      "deprecation",
                      "removal",
                      "removed"
                  ]
              ):
                  docs_commit = commit
                  break

          if docs_commit:
              sources["docs"] = commit_item(
                  docs_commit,
                  "docs",
                  "Documentation Update"
              )
          else:
              sources["docs"] = {"found": False}

          social_commits = []

          for path in [
              "resources/discord-social-sdk",
              "developers/discord-social-sdk"
          ]:
              social_commits.extend(
                  github_commits(path, 5)
              )

          if social_commits:
              social_commits.sort(
                  key=lambda x: x.get("commit", {})
                  .get("author", {})
                  .get("date", ""),
                  reverse=True
              )

              sources["social_sdk"] = commit_item(
                  social_commits[0],
                  "social_sdk",
                  "Social SDK"
              )
          else:
              sources["social_sdk"] = {"found": False}

          all_commits = github_commits(
              None,
              30
          )

          breaking_commit = None

          for commit in all_commits:
              message = (
                  commit.get("commit", {})
                  .get("message", "")
                  .lower()
              )

              if any(
                  term in message
                  for term in [
                      "breaking",
                      "deprecated",
                      "deprecation",
                      "removal",
                      "removed"
                  ]
              ):
                  breaking_commit = commit
                  break

          if breaking_commit:
              sources["breaking"] = commit_item(
                  breaking_commit,
                  "breaking",
                  "Breaking Change"
              )
          else:
              sources["breaking"] = {"found": False}

          with open(
              "sources.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(
              sources,
              ensure_ascii=False,
              indent=2
          ))
          PY

          python3 discover.py

      - name: Create Components V2 sender
        run: |
          cat > send.py <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          import uuid

          category = sys.argv[1]
          webhook = os.environ["WEBHOOK_URL"]

          with open(
              "sources.json",
              "r",
              encoding="utf-8"
          ) as f:
              sources = json.load(f)

          item = sources.get(category)

          if not item or not item.get("found"):
              print(f"No update for {category}")
              sys.exit(0)

          state_dir = ".discord-state"
          os.makedirs(state_dir, exist_ok=True)

          state_file = os.path.join(
              state_dir,
              f"{category}.state"
          )

          source_id = (
              item.get("_sha")
              or item.get("url")
              or item.get("title")
          )

          old_id = ""

          if os.path.exists(state_file):
              with open(
                  state_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_id = f.read().strip()

          if old_id == source_id:
              print(
                  f"Already sent {category}: {source_id}"
              )
              sys.exit(0)

          title = item.get(
              "title",
              "Official Discord Update"
          )[:250]

          description = item.get(
              "description",
              "An official update was published."
          )[:1800]

          source = item.get(
              "source",
              "Discord"
          )

          item_type = item.get(
              "type",
              category
          )

          url = item.get("url", "")

          image_url = item.get(
              "image",
              ""
          )

          if not (
              image_url.startswith("http://")
              or image_url.startswith("https://")
          ):
              image_url = ""

          info = (
              f"**Source**\n"
              f"{source}\n\n"
              f"**Type**\n"
              f"{item_type}"
          )

          if item.get("author"):
              info += (
                  f"\n\n**Author**\n"
                  f"{item['author']}"
              )

          if item.get("commit"):
              info += (
                  f"\n\n**Commit**\n"
                  f"`{item['commit']}`"
              )

          if item.get("files"):
              info += (
                  f"\n\n**Changed Files**\n"
                  f"```text\n"
                  f"{item['files'][:700]}"
                  f"\n```"
              )

          attachment_name = (
              "official-update-"
              f"{category}.txt"
          )

          attachment_content = (
              f"{title}\n\n"
              f"{description}\n\n"
              f"Source: {source}\n"
              f"Type: {item_type}\n"
              f"URL: {url}\n"
          )

          if item.get("commit"):
              attachment_content += (
                  f"Commit: {item['commit']}\n"
              )

          if item.get("files"):
              attachment_content += (
                  "\nChanged Files:\n"
                  f"{item['files']}\n"
              )

          components = []

          if image_url:
              components.append({
                  "type": 12,
                  "items": [
                      {
                          "media": {
                              "url": image_url
                          },
                          "description": (
                              f"{title} official update image"
                          )[:1024]
                      }
                  ]
              })

          components.append({
              "type": 14,
              "divider": True,
              "spacing": 1
          })

          components.append({
              "type": 17,
              "accent_color": 5793266,
              "components": [
                  {
                      "type": 10,
                      "content": (
                          f"# {title}\n\n"
                          f"{description}"
                      )
                  },
                  {
                      "type": 14,
                      "divider": True,
                      "spacing": 1
                  },
                  {
                      "type": 9,
                      "components": [
                          {
                              "type": 10,
                              "content": info[:1900]
                          }
                      ],
                      "accessory": {
                          "type": 11,
                          "media": {
                              "url": image_url
                          },
                          "description": "Official update"
                      }
                  },
                  {
                      "type": 14,
                      "divider": True,
                      "spacing": 1
                  },
                  {
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "Open Official Update",
                              "url": url
                          }
                      ]
                  },
                  {
                      "type": 13,
                      "file": {
                          "url": (
                              "attachment://"
                              f"{attachment_name}"
                          )
                      }
                  }
              ]
          })

          usernames = {
              "changelog": "Changelog Updates",
              "patch_notes": "Patch Notes",
              "developer_news": "Developer News",
              "api": "API Updates",
              "docs": "Docs Updates",
              "social_sdk": "Social SDK",
              "breaking": "Breaking Changes"
          }

          payload = {
              "username": usernames.get(
                  category,
                  "Docs Updates"
              ),
              "flags": 32768,
              "components": components
          }

          boundary = (
              "----DiscordDocs"
              + uuid.uuid4().hex
          )

          parts = []

          payload_json = json.dumps(
              payload,
              ensure_ascii=False,
              separators=(",", ":")
          )

          parts.append(
              (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; '
                  f'name="payload_json"\r\n'
                  f"Content-Type: application/json\r\n"
                  f"\r\n"
                  f"{payload_json}\r\n"
              ).encode("utf-8")
          )

          file_bytes = attachment_content.encode(
              "utf-8"
          )

          file_header = (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; '
              f'name="files[0]"; '
              f'filename="{attachment_name}"\r\n'
              f"Content-Type: text/plain; charset=utf-8\r\n"
              f"\r\n"
          ).encode("utf-8")

          parts.append(
              file_header
              + file_bytes
              + b"\r\n"
          )

          parts.append(
              f"--{boundary}--\r\n".encode("utf-8")
          )

          body = b"".join(parts)

          separator = (
              "&" if "?" in webhook else "?"
          )

          endpoint = (
              webhook
              + separator
              + "with_components=true"
              + "&wait=true"
          )

