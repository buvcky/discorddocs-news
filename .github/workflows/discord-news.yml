name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Fetch and send Discord updates
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.parse
          from html import unescape
          from pathlib import Path
          from datetime import datetime

          STATE_DIR = Path(".discord-state")
          STATE_DIR.mkdir(exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; DiscordDocsNews/1.0)",
              "Accept": "text/html,application/xhtml+xml",
          }

          SOURCES = {
              "patch_notes": {
                  "webhook": "WEBHOOK_PATCH_NOTES",
                  "url": "https://discord.com/blog",
                  "keywords": [
                      "discord patch notes",
                      "patch notes"
                  ],
              },
              "developer_news": {
                  "webhook": "WEBHOOK_DEVELOPER_NEWS",
                  "url": "https://discord.com/developers/developer-newsletter",
                  "keywords": [
                      "developer newsletter",
                      "discord’s latest developer updates",
                      "discord's latest developer updates"
                  ],
              },
              "changelog": {
                  "webhook": "WEBHOOK_CHANGELOG",
                  "url": "https://discord.com/blog",
                  "keywords": [
                      "changelog"
                  ],
              },
              "social_sdk": {
                  "webhook": "WEBHOOK_SOCIAL_SDK",
                  "url": "https://discord.com/developers/docs/social-sdk/release_notes.html",
                  "keywords": [
                      "release notes",
                      "social sdk"
                  ],
              },
              "api": {
                  "webhook": "WEBHOOK_API",
                  "url": "https://discord.com/developers/docs/change-log",
                  "keywords": [
                      "api"
                  ],
              },
              "docs": {
                  "webhook": "WEBHOOK_DOCS",
                  "url": "https://discord.com/developers/docs",
                  "keywords": [
                      "documentation",
                      "docs"
                  ],
              },
              "breaking": {
                  "webhook": "WEBHOOK_BREAKING",
                  "url": "https://discord.com/blog",
                  "keywords": [
                      "breaking",
                      "important",
                      "security"
                  ],
              },
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="replace")

          def clean_html(value):
              value = re.sub(r"<script\b[^>]*>.*?</script>", " ", value, flags=re.I | re.S)
              value = re.sub(r"<style\b[^>]*>.*?</style>", " ", value, flags=re.I | re.S)
              value = re.sub(r"<[^>]+>", " ", value)
              value = unescape(value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def absolute(base, href):
              return urllib.parse.urljoin(base, href)

          def extract_links(html, base):
              pattern = re.compile(
                  r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                  re.I | re.S
              )

              results = []

              for href, raw_text in pattern.findall(html):
                  text = clean_html(raw_text)

                  if not href or not text:
                      continue

                  href = absolute(base, href)

                  if not href.startswith("https://discord.com/"):
                      continue

                  if len(text) < 8:
                      continue

                  results.append((text, href))

              return results

          def extract_blog_article(html):
              links = extract_links(html, "https://discord.com/blog")

              candidates = []

              for title, url in links:
                  low = title.lower()

                  if (
                      "patch notes" in low
                      or "changelog" in low
                      or "discord update" in low
                      or "social sdk" in low
                      or "engineering" in low
                  ):
                      candidates.append((title, url))

              seen = set()

              for title, url in candidates:
                  if url in seen:
                      continue

                  seen.add(url)

                  if "/blog/" in url:
                      return {
                          "title": title,
                          "url": url
                      }

              return None

          def extract_newsletter(html):
              links = extract_links(
                  html,
                  "https://discord.com/developers/developer-newsletter"
              )

              candidates = []

              for title, url in links:
                  low = title.lower()

                  if (
                      "2026" in title
                      or "2025" in title
                      or "developer" in low
                      or "discord" in low
                  ):
                      candidates.append((title, url))

              for title, url in candidates:
                  if "/developer-newsletter/" in url:
                      return {
                          "title": title,
                          "url": url
                      }

              return None

          def extract_social_sdk(html):
              text = clean_html(html)

              versions = re.findall(
                  r'\b(\d+\.\d+\.\d+)\s*\((\d{4}-\d{2}-\d{2})\)',
                  text
              )

              if not versions:
                  return None

              version, date = versions[0]

              return {
                  "title": f"Discord Social SDK {version}",
                  "url": "https://discord.com/developers/docs/social-sdk/release_notes.html",
                  "date": date
              }

          def make_id(item):
              raw = item["url"] + "|" + item["title"] + "|" + item.get("date", "")
              return hashlib.sha256(raw.encode()).hexdigest()

          def state_path(category):
              return STATE_DIR / f"{category}.state"

          def read_state(category):
              p = state_path(category)

              if not p.exists():
                  return ""

              return p.read_text().strip()

          def write_state(category, value):
              state_path(category).write_text(value)

          def send(category, item):
              secret_name = SOURCES[category]["webhook"]
              webhook = os.environ.get(secret_name, "").strip()

              if not webhook:
                  raise RuntimeError(f"{secret_name} is empty")

              payload = {
                  "flags": 32768,
                  "components": [
                      {
                          "type": 17,
                          "components": [
                              {
                                  "type": 10,
                                  "content": f"## {item['title']}"
                              },
                              {
                                  "type": 14,
                                  "spacing": 1
                              },
                              {
                                  "type": 10,
                                  "content": f"[Read the full update]({item['url']})"
                              }
                          ]
                      }
                  ]
              }

              data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  webhook + "?with_components=true&wait=true",
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "DiscordDocsNews/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      print(f"{category}: Discord HTTP {response.status}")
                      print(body[:500])
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"{category}: Discord HTTP {e.code}: {body}"
                  )

          def process(category, item):
              if not item:
                  print(f"{category}: no update found")
                  return

              item["id"] = make_id(item)

              print(f"{category}: {item['title']}")
              print(f"{category}: {item['url']}")
              print(f"{category}: {item['id']}")

              old = read_state(category)

              if old == item["id"]:
                  print(f"{category}: already sent")
                  return

              send(category, item)
              write_state(category, item["id"])
              print(f"{category}: sent successfully")

          print("Starting Discord update scan...")
          print("Time:", datetime.utcnow().isoformat())

          blog = fetch("https://discord.com/blog")
          newsletter = fetch(
              "https://discord.com/developers/developer-newsletter"
          )
          social_sdk = fetch(
              "https://discord.com/developers/docs/social-sdk/release_notes.html"
          )

          patch = None
          changelog = None
          breaking = None

          blog_links = extract_links(blog, "https://discord.com/blog")

          for title, url in blog_links:
              low = title.lower()

              item = {
                  "title": title,
                  "url": url
              }

              if not patch and "patch notes" in low:
                  patch = item

              if not changelog and "changelog" in low:
                  changelog = item

              if not breaking and (
                  "breaking" in low
                  or "security" in low
              ):
                  breaking = item

          developer_news = extract_newsletter(newsletter)
          sdk = extract_social_sdk(social_sdk)

          api = None
          docs = None

          api_links = extract_links(
              "https://discord.com/developers/docs/change-log",
              "https://discord.com/developers/docs/change-log"
          )

          api = {
              "title": "Discord API Developer Changelog",
              "url": "https://discord.com/developers/docs/change-log"
          }

          docs = {
              "title": "Discord Developer Documentation",
              "url": "https://discord.com/developers/docs"
          }

          process("patch_notes", patch)
          process("developer_news", developer_news)
          process("changelog", changelog)
          process("social_sdk", sdk)
          process("api", api)
          process("docs", docs)
          process("breaking", breaking)

          print("Scan completed.")
          PY
