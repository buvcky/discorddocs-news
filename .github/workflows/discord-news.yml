name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-state-${{ github.run_id }}
          restore-keys: |
            discord-news-state-

      - name: Fetch official Discord updates
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from html import unescape

          STATE = Path(".discord-state")
          STATE.mkdir(exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 DiscordDocsNews/4.0",
              "Accept": "text/html,application/xhtml+xml,*/*",
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)

              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise RuntimeError(
                      f"HTTP {e.code} fetching {url}: {body[:300]}"
                  )

          def text(value):
              value = unescape(value or "")

              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()

          def links(html, base):
              result = []

              pattern = re.compile(
                  r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>'
                  r'(.*?)'
                  r'</a>',
                  re.I | re.S
              )

              for href, body in pattern.findall(html):
                  title = text(body)

                  if not title:
                      continue

                  url = urllib.parse.urljoin(
                      base,
                      unescape(href)
                  )

                  if url.startswith(
                      "https://discord.com/"
                  ):
                      result.append(
                          (url, title)
                      )

              return result

          def meta(html, key):
              patterns = [
                  rf'<meta\b[^>]*(?:property|name)=["\']{re.escape(key)}["\'][^>]*content=["\']([^"\']+)["\']',
                  rf'<meta\b[^>]*content=["\']([^"\']+)["\'][^>]*(?:property|name)=["\']{re.escape(key)}["\']',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      html,
                      re.I
                  )

                  if match:
                      return unescape(
                          match.group(1)
                      ).strip()

              return ""

          def article(url):
              html = fetch(url)

              title = meta(
                  html,
                  "og:title"
              )

              if not title:
                  match = re.search(
                      r"<h1\b[^>]*>(.*?)</h1>",
                      html,
                      re.I | re.S
                  )

                  title = (
                      text(match.group(1))
                      if match
                      else "Discord Update"
                  )

              date = meta(
                  html,
                  "article:published_time"
              )

              if date:
                  date = date[:10]

              match = re.search(
                  r"<article\b[^>]*>(.*?)</article>",
                  html,
                  re.I | re.S
              )

              body = (
                  match.group(1)
                  if match
                  else html
              )

              body = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<(nav|header|footer)\b[^>]*>.*?</\1>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"</(h[1-6]|p|li|blockquote|pre|div|section)>",
                  "\n\n",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<li\b[^>]*>",
                  "- ",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<[^>]+>",
                  " ",
                  body
              )

              body = unescape(body)

              lines = []

              for line in body.splitlines():
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  ).strip()

                  if line and (
                      not lines or
                      line != lines[-1]
                  ):
                      lines.append(line)

              content = "\n\n".join(
                  lines
              ).strip()

              if title:
                  content = re.sub(
                      r"^" + re.escape(title) + r"\s*",
                      "",
                      content,
                      count=1,
                      flags=re.I
                  ).strip()

              images = []

              for key in (
                  "og:image",
                  "twitter:image"
              ):
                  value = meta(
                      html,
                      key
                  )

                  if not value:
                      continue

                  value = urllib.parse.urljoin(
                      url,
                      value
                  )

                  if (
                      value.startswith("http")
                      and value not in images
                  ):
                      images.append(value)

              return {
                  "title": title,
                  "date": date,
                  "url": url,
                  "content": content,
                  "images": images[:1],
              }

          def latest_tag(tag_url, phrase):
              html = fetch(tag_url)

              candidates = []

              for url, title in links(
                  html,
                  tag_url
              ):
                  if (
                      "/blog/" in url
                      and phrase.lower()
                      in title.lower()
                  ):
                      candidates.append(url)

              if not candidates:
                  raise RuntimeError(
                      f"No {phrase} article found at {tag_url}"
                  )

              return article(
                  candidates[0]
              )

          def newsletter():
              base = (
                  "https://discord.com/"
                  "developers/developer-newsletter"
              )

              html = fetch(base)

              for url, title in links(
                  html,
                  base
              ):
                  if (
                      "/developer-newsletter/"
                      in url
                  ):
                      return article(url)

              raise RuntimeError(
                  "No developer newsletter found"
              )

          def changelog():
              url = (
                  "https://discord.com/"
                  "developers/docs/change-log"
              )

              html = fetch(url)

              title = (
                  "Discord Developer Changelog"
              )

              match = re.search(
                  r"<main\b[^>]*>(.*?)</main>",
                  html,
                  re.I | re.S
              )

              body = (
                  match.group(1)
                  if match
                  else html
              )

              body = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"</(h[1-6]|p|li|blockquote|pre|div|section|article)>",
                  "\n\n",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<li\b[^>]*>",
                  "- ",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<[^>]+>",
                  " ",
                  body
              )

              body = unescape(body)

              lines = []

              for line in body.splitlines():
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  ).strip()

                  if line:
                      lines.append(line)

              content = "\n\n".join(
                  lines
              )

              return {
                  "title": title,
                  "date": "",
                  "url": url,
                  "content": content,
                  "images": [],
              }

          def section(item, terms):
              lower = item["content"].lower()
              positions = []

              for term in terms:
                  position = lower.find(
                      term.lower()
                  )

                  if position >= 0:
                      positions.append(
                          position
                      )

              if not positions:
                  return None

              position = min(positions)

              start = max(
                  0,
                  position - 500
              )

              end = min(
                  len(item["content"]),
                  position + 3500
              )

              return {
                  "title": item["title"],
                  "date": item["date"],
                  "url": item["url"],
                  "content": item["content"][
                      start:end
                  ].strip(),
                  "images": item["images"],
              }

          def chunks(content, limit=3500):
              paragraphs = content.split(
                  "\n\n"
              )

              result = []
              current = ""

              for paragraph in paragraphs:
                  paragraph = paragraph.strip()

                  if not paragraph:
                      continue

                  candidate = (
                      paragraph
                      if not current
                      else current
                      + "\n\n"
                      + paragraph
                  )

                  if len(candidate) <= limit:
                      current = candidate
                      continue

                  if current:
                      result.append(current)

                  while len(paragraph) > limit:
                      cut = paragraph.rfind(
                          " ",
                          0,
                          limit
                      )

                      if cut < 500:
                          cut = limit

                      result.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = paragraph[
                          cut:
                      ].strip()

                  current = paragraph

              if current:
                  result.append(current)

              return result or [""]

          def send(category, item, secret):
              webhook = os.environ.get(
                  secret,
                  ""
              ).strip()

              if not webhook:
                  raise RuntimeError(
                      f"{secret} is empty"
                  )

              identity = json.dumps(
                  item,
                  ensure_ascii=False,
                  sort_keys=True
              )

              update_id = hashlib.sha256(
                  identity.encode("utf-8")
              ).hexdigest()

              state = STATE / (
                  f"{category}.state"
              )

              if (
                  state.exists()
                  and state.read_text(
                      encoding="utf-8"
                  ).strip() == update_id
              ):
                  print(
                      f"{category}: already sent"
                  )
                  return

              parts = chunks(
                  item["content"]
              )

              print(
                  f"{category}: "
                  f"{len(parts)} message(s)"
              )

              for index, part in enumerate(
                  parts
              ):
                  components = []

                  if (
                      index == 0
                      and item["images"]
                  ):
                      components.append({
                          "type": 12,
                          "items": [
                              {
                                  "type": 1,
                                  "media": {
                                      "url": item[
                                          "images"
                                      ][0]
                                  }
                              }
                          ]
                      })

                  components.append({
                      "type": 10,
                      "content": (
                          f"# {item['title']}"
                      )
                  })

                  if item["date"]:
                      components.append({
                          "type": 10,
                          "content": (
                              "**Published:** "
                              + item["date"]
                          )
                      })

                  components.append({
                      "type": 14,
                      "spacing": 1
                  })

                  components.append({
                      "type": 10,
                      "content": part
                  })

                  components.append({
                      "type": 14,
                      "spacing": 1
                  })

                  components.append({
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "View Source",
                              "url": item["url"]
                          }
                      ]
                  })

                  payload = {
                      "flags": 32768,
                      "components": [
                          {
                              "type": 17,
                              "components": components
                          }
                      ]
                  }

                  data = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

                  request = urllib.request.Request(
                      webhook
                      + "?with_components=true&wait=true",
                      data=data,
                      headers={
                          "Content-Type":
                              "application/json",
                          "User-Agent":
                              "DiscordDocsNews/4.0"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=40
                      ) as response:
                          print(
                              f"{category}: "
                              f"HTTP {response.status} "
                              f"part "
                              f"{index + 1}/"
                              f"{len(parts)}"
                          )

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          "replace"
                      )

                      raise RuntimeError(
                          f"{category}: Discord HTTP "
                          f"{error.code}: "
                          f"{body[:1000]}"
                      )

              state.write_text(
                  update_id,
                  encoding="utf-8"
              )

              print(
                  f"{category}: sent"
              )

          patch = latest_tag(
              "https://discord.com/tags/patch-notes",
              "Patch Notes"
          )

          change = latest_tag(
              "https://discord.com/tags/changelog",
              "Changelog"
          )

          news = newsletter()

          developer_log = changelog()

          updates = [
              (
                  "patch_notes",
                  patch,
                  "WEBHOOK_PATCH_NOTES"
              ),
              (
                  "changelog",
                  change,
                  "WEBHOOK_CHANGELOG"
              ),
              (
                  "developer_news",
                  news,
                  "WEBHOOK_DEVELOPER_NEWS"
              ),
              (
                  "api",
                  section(
                      developer_log,
                      [
                          "HTTP API",
                          "API Changes",
                          "REST API"
                      ]
                  ),
                  "WEBHOOK_API"
              ),
              (
                  "docs",
                  section(
                      developer_log,
                      [
                          "Documentation",
                          "Docs"
                      ]
                  ),
                  "WEBHOOK_DOCS"
              ),
              (
                  "social_sdk",
                  section(
                      developer_log,
                      
