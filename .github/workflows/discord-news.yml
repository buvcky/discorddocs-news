name: Discord Docs News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: .discord-news-state.json
          key: discord-news-state-v1-${{ hashFiles('.discord-news-state.json') }}
          restore-keys: discord-news-state-v1-

      - name: Initialize state file
        run: |
          if [ ! -f .discord-news-state.json ]; then
            echo "{}" > .discord-news-state.json
          fi

      - name: Build and run updater
        env:
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
        run: |
          cat > discord_news.py << 'EOFPYTHON'
import os
import re
import json
import hashlib
from urllib.parse import urljoin, urlparse
import requests
from bs4 import BeautifulSoup, Tag, NavigableString

V2 = 32768
MAX_TEXT = 3900
MAX_PAYLOAD = 8000
STATE = ".discord-news-state.json"

S = requests.Session()
S.headers.update({
    "User-Agent": "Mozilla/5.0 DiscordDocsNews/1.0",
    "Accept": "text/html,application/xhtml+xml",
    "Accept-Language": "en-US,en;q=0.9",
})

CONFIG = {
    "changelog": ("WEBHOOK_CHANGELOG",
                  "https://discord.com/tags/changelog",
                  "tag", ["changelog"]),
    "patch_notes": ("WEBHOOK_PATCH_NOTES",
                    "https://discord.com/tags/patch-notes",
                    "tag", ["patch notes", "patch-notes"]),
    "developer_news": ("WEBHOOK_DEVELOPER_NEWS",
                       "https://discord.com/developers/developer-newsletter",
                       "newsletter", []),
    "api": ("WEBHOOK_API",
            "https://discord.com/developers/docs/change-log",
            "developer", ["http api", "rest api", "api updates"]),
    "docs": ("WEBHOOK_DOCS",
             "https://discord.com/developers/docs/change-log",
             "developer", ["documentation", "docs updates"]),
    "social_sdk": ("WEBHOOK_SOCIAL_SDK",
                   "https://discord.com/developers/docs/change-log",
                   "developer", ["social sdk"]),
    "breaking": ("WEBHOOK_BREAKING",
                 "https://discord.com/developers/docs/change-log",
                 "developer", ["breaking change", "breaking changes"]),
}

CURRENT = ""

def die(msg):
    raise RuntimeError(msg)

def fetch(url):
    r = S.get(url, timeout=30)
    if r.status_code != 200:
        die(f"GET {url} -> HTTP {r.status_code}")
    if not r.text.strip():
        die(f"Empty response: {url}")
    return r.text

def absurl(base, href):
    return urljoin(base, href.split("#")[0]) if href else None

def clean(s):
    s = re.sub(r"[ \t]+", " ", s or "")
    s = re.sub(r"\n[ \t]+", "\n", s)
    s = re.sub(r"\n{3,}", "\n\n", s)
    return s.strip()

def inline(n):
    if isinstance(n, NavigableString):
        return str(n)
    if not isinstance(n, Tag):
        return ""
    name = n.name.lower()
    if name in {"script", "style", "noscript", "template"}:
        return ""
    if name == "br":
        return "\n"
    x = "".join(inline(c) for c in n.children)
    if name in {"strong", "b"}:
        return f"**{x.strip()}**" if x.strip() else ""
    if name in {"em", "i"}:
        return f"*{x.strip()}*" if x.strip() else ""
    if name == "del":
        return f"~~{x.strip()}~~" if x.strip() else ""
    if name == "code":
        return f"`{x.strip()}`" if x.strip() else ""
    if name == "a":
        label = clean(x)
        href = absurl(CURRENT, n.get("href"))
        return f"[{label}]({href})" if label and href else label
    return x

def img_url(n):
    src = n.get("src") or n.get("data-src") or n.get("data-lazy-src")
    if not src or src.startswith("data:"):
        return None
    return absurl(CURRENT, src)

def text(out, value):
    value = clean(value)
    while len(value) > MAX_TEXT:
        cut = value.rfind("\n\n", 0, MAX_TEXT)
        if cut < 500:
            cut = value.rfind("\n", 0, MAX_TEXT)
        if cut < 500:
            cut = MAX_TEXT
        out.append({"type": 10, "content": value[:cut].strip()})
        value = value[cut:].strip()
    if value:
        out.append({"type": 10, "content": value})

def inline_children(n, out):
    buf = []
    def flush():
        if buf:
            text(out, "".join(buf))
            buf.clear()
    for c in n.children:
        if isinstance(c, Tag) and c.name.lower() == "img":
            flush()
            u = img_url(c)
            if u:
                out.append({"type": 12, "items": [{"media": {"url": u}}]})
        else:
            buf.append(inline(c))
    flush()

def render(n, out):
    if not isinstance(n, Tag):
        return
    name = n.name.lower()
    if name in {"script", "style", "noscript", "template", "nav", "footer", "header"}:
        return
    if name == "img":
        u = img_url(n)
        if u:
            out.append({"type": 12, "items": [{"media": {"url": u}}]})
        return
    if name == "hr":
        out.append({"type": 14})
        return
    if name in {"h1", "h2", "h3", "h4", "h5", "h6", "p"}:
        inline_children(n, out)
        return
    if name == "blockquote":
        x = clean(inline(n))
        if x:
            text(out, "> " + x.replace("\n", "\n> "))
        return
    if name == "pre":
        x = clean(n.get_text("\n", strip=True))
        if x:
            text(out, "```\n" + x + "\n```")
        return
    if name in {"ul", "ol"}:
        rows = []
        for i, li in enumerate(n.find_all("li", recursive=False), 1):
            x = clean(inline(li))
            if x:
                rows.append((f"{i}. " if name == "ol" else "- ") + x)
        if rows:
            text(out, "\n".join(rows))
        return
    if name == "table":
        rows = []
        for tr in n.find_all("tr"):
            cells = [clean(inline(c)) for c in tr.find_all(["th", "td"], recursive=False)]
            cells = [x for x in cells if x]
            if cells:
                rows.append(" | ".join(cells))
        if rows:
            text(out, "\n".join(rows))
        return
    for c in n.children:
        if isinstance(c, Tag):
            render(c, out)

def article_root(soup):
    candidates = []
    for sel in ["article", "main article", "main", '[role="main"]']:
        for n in soup.select(sel):
            size = len(clean(n.get_text(" ", strip=True)))
            if size >= 300:
                candidates.append((size, n))
    if not candidates:
        die("Could not find article root")
    return max(candidates, key=lambda x: x[0])[1]

def article(url):
    global CURRENT
    CURRENT = url
    soup = BeautifulSoup(fetch(url), "lxml")
    root = article_root(soup)
    for n in root.select("script,style,noscript,template,nav,footer,header"):
        n.decompose()
    out = []
    for c in root.children:
        if isinstance(c, Tag):
            render(c, out)
    cleanout = []
    last = None
    for c in out:
        if c["type"] == 10:
            c["content"] = clean(c["content"])
            if not c["content"] or last == ("t", c["content"]):
                continue
            last = ("t", c["content"])
        elif c["type"] == 12:
            u = c["items"][0]["media"]["url"]
            if not u:
                continue
            last = ("i", u)
        else:
            last = None
        cleanout.append(c)
    if not cleanout:
        die(f"No article content: {url}")
    return cleanout

def source_tag(url, terms):
    soup = BeautifulSoup(fetch(url), "lxml")
    found = []
    for a in soup.find_all("a", href=True):
        u = absurl(url, a["href"])
        if not u or "/blog/" not in urlparse(u).path:
            continue
        s = (urlparse(u).path + " " + a.get_text(" ", strip=True)).lower()
        if any(t.lower() in s for t in terms):
            found.append(u)
    if not found:
        die(f"No article found on {url}")
    return found[0]

def source_newsletter(url):
    soup = BeautifulSoup(fetch(url), "lxml")
    for a in soup.find_all("a", href=True):
        u = absurl(url, a["href"])
        if u and ("newsletter" in urlparse(u).path.lower()):
            if clean(a.get_text(" ", strip=True)):
                return u
    die(f"No developer newsletter article found on {url}")

def source_developer(url, category, terms):
    soup = BeautifulSoup(fetch(url), "lxml")
    candidates = []
    for a in soup.find_all("a", href=True):
        u = absurl(url, a["href"])
        label = clean(a.get_text(" ", strip=True))
        if not u or not label:
            continue
        hay = (label + " " + u).lower()
        if any(t.lower() in hay for t in terms):
            candidates.append((u, label))
    if not candidates:
        die(f"No developer changelog entry for {terms}")
    best_match = candidates[0][0]
    if category == "breaking":
        for u, label in candidates:
            if "breaking" in label.lower():
                best_match = u
                break
    return best_match

def source(kind, url, category, terms):
    if kind == "tag":
        return source_tag(url, terms)
    if kind == "newsletter":
        return source_newsletter(url)
    return source_developer(url, category, terms)

def split_components(cs):
    out = []
    for c in cs:
        if c["type"] != 10 or len(c["content"]) <= MAX_TEXT:
            out.append(c)
            continue
        x = c["content"]
        while len(x) > MAX_TEXT:
            cut = x.rfind("\n\n", 0, MAX_TEXT)
            if cut < 500:
                cut = x.rfind("\n", 0, MAX_TEXT)
            if cut < 500:
                cut = MAX_TEXT
            out.append({"type": 10, "content": x[:cut].strip()})
            x = x[cut:].strip()
        if x:
            out.append({"type": 10, "content": x})
    return out

def size(p):
    return len(json.dumps(p, ensure_ascii=False, separators=(",", ":")).encode())

def messages(cs, url):
    cs = split_components(cs)
    groups = []
    cur = []
    for c in cs:
        test = {"flags": V2, "components": cur + [c]}
        if cur and size(test) > MAX_PAYLOAD:
            groups.append(cur)
            cur = [c]
        else:
            cur.append(c)
    if cur:
        groups.append(cur)
    groups[-1].append({
        "type": 1,
        "components": [{
            "type": 2,
            "style": 5,
            "label": "View Source",
            "url": url
        }]
    })
    return [{"flags": V2, "components": g} for g in groups]

def load_state():
    try:
        with open(STATE, encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return {}

def save_state(s):
    with open(STATE, "w", encoding="utf-8") as f:
        json.dump(s, f, ensure_ascii=False, indent=2)

def send(webhook, payload):
    if not webhook:
        die("Webhook secret is empty")
    sep = "&" if "?" in webhook else "?"
    r = S.post(webhook + sep + "with_components=true",
               json=payload, timeout=30)
    if r.status_code not in (200, 204):
        die(f"Discord HTTP {r.status_code}: {r.text[:2000]}")

def main():
    state = load_state()
    print(f"✓ Loaded state for {len(state)} categories")
    errors = []
    for category, (secret, url, kind, terms) in CONFIG.items():
        try:
            print(f"\n{'='*50}")
            print(f"📰 {category.upper()}")
            print(f"{'='*50}")
            webhook = os.environ.get(secret)
            if not webhook:
                die(f"❌ Secret {secret} is missing")
            print(f"Source: {url}")
            current = source(kind, url, category, terms)
            ident = hashlib.sha256(current.encode()).hexdigest()
            if state.get(category) == ident:
                print("ℹ️  No new update (state matched)")
                continue
            print("🔍 New update found, parsing content...")
            cs = article(current)
            ms = messages(cs, current)
            print(f"✓ Generated {len(cs)} components in {len(ms)} message(s)")
            for i, payload in enumerate(ms, 1):
                p_size = size(payload)
                print(f"  → Sending message {i}/{len(ms)} ({p_size} bytes)")
                send(webhook, payload)
            state[category] = ident
            save_state(state)
            print(f"✅ {category} sent successfully")
        except Exception as e:
            print(f"❌ ERROR [{category}]: {e}")
            import traceback
            traceback.print_exc()
            errors.append(f"{category}: {e}")
    print(f"\n{'='*50}")
    if errors:
        print(f"🚨 FAILURES ({len(errors)})")
        print(f"{'='*50}")
        for err in errors:
            print(f"  ✗ {err}")
        raise SystemExit(1)
    print(f"✅ SUCCESS: All {len(CONFIG)} categories completed")
    print(f"{'='*50}")

if __name__ == "__main__":
    main()
EOFPYTHON

          echo "🔍 Validating Python syntax..."
          python -m py_compile discord_news.py
          echo "✅ Python syntax is valid"
          echo ""
          echo "🚀 Running Discord News Updater..."
          python discord_news.py

      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .discord-news-state.json
          key: discord-news-state-v1-${{ hashFiles('.discord-news-state.json') }}
          
