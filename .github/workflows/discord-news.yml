name: Discord Official News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  discord-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Discover the latest official Discord sources
      # ------------------------------------------------------------
      - name: Discover official sources
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import re
          import hashlib
          import html
          import os
          import urllib.request
          from urllib.parse import urljoin

          UA = "Mozilla/5.0 (compatible; DiscordDocsNews/1.0)"

          def fetch(url, headers=None):
              h = {"User-Agent": UA}
              if headers:
                  h.update(headers)

              req = urllib.request.Request(url, headers=h)

              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          def fetch_json(url):
              data = fetch(
                  url,
                  {
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "Authorization": f"Bearer {os.environ.get('GITHUB_TOKEN', '')}",
                  },
              )
              return json.loads(data)

          def sha(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()[:32]

          def clean_text(value):
              value = html.unescape(value)
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def meta(page, name):
              patterns = [
                  rf'<meta[^>]+property=["\']{re.escape(name)}["\'][^>]+content=["\'](.*?)["\']',
                  rf'<meta[^>]+content=["\'](.*?)["\'][^>]+property=["\']{re.escape(name)}["\']',
              ]

              for pattern in patterns:
                  m = re.search(pattern, page, re.I | re.S)
                  if m:
                      return clean_text(m.group(1))

              return ""

          def article_details(url):
              try:
                  page = fetch(url)

                  title = (
                      meta(page, "og:title")
                      or meta(page, "twitter:title")
                  )

                  description = (
                      meta(page, "og:description")
                      or meta(page, "twitter:description")
                      or meta(page, "description")
                  )

                  image = (
                      meta(page, "og:image")
                      or meta(page, "twitter:image")
                  )

                  return {
                      "title": title or "Official Discord Update",
                      "description": description,
                      "image": image,
                  }

              except Exception:
                  return {
                      "title": "Official Discord Update",
                      "description": "",
                      "image": "",
                  }

          def find_link(page, pattern):
              # Look for relative and absolute Discord links.
              candidates = []

              regexes = [
                  rf'href=["\'](https://discord\.com{pattern})["\']',
                  rf'href=["\']({pattern})["\']',
              ]

              for regex in regexes:
                  for match in re.finditer(regex, page, re.I):
                      candidates.append(match.group(1))

              # Preserve first occurrence.
              seen = set()

              for candidate in candidates:
                  candidate = html.unescape(candidate)
                  candidate = candidate.split("?")[0]
                  candidate = candidate.rstrip("/")

                  if candidate in seen:
                      continue

                  seen.add(candidate)

                  if candidate.startswith("/"):
                      candidate = urljoin("https://discord.com", candidate)

                  return candidate

              return ""

          sources = {}

          # ----------------------------------------------------------
          # 1. Discord Changelog
          # Official Discord Blog
          # ----------------------------------------------------------
          try:
              page = fetch("https://discord.com/blog")

              url = find_link(
                  page,
                  r"/blog/discord-update-[^\"'#?]+"
              )

              if url:
                  details = article_details(url)

                  sources["changelog"] = {
                      "found": True,
                      "url": url,
                      "title": details["title"],
                      "description": details["description"],
                      "image": details["image"],
                      "id": sha(url),
                      "source": "Discord Blog",
                      "type": "Changelog",
                  }

          except Exception as e:
              print("Changelog discovery failed:", e)

          # ----------------------------------------------------------
          # 2. Discord Patch Notes
          # Official Patch Notes tag
          # ----------------------------------------------------------
          try:
              page = fetch("https://discord.com/tags/patch-notes")

              url = find_link(
                  page,
                  r"/blog/discord-patch-notes-[^\"'#?]+"
              )

              if url:
                  details = article_details(url)

                  sources["patch_notes"] = {
                      "found": True,
                      "url": url,
                      "title": details["title"],
                      "description": details["description"],
                      "image": details["image"],
                      "id": sha(url),
                      "source": "Discord Patch Notes",
                      "type": "Patch Notes",
                  }

          except Exception as e:
              print("Patch Notes discovery failed:", e)

          # ----------------------------------------------------------
          # 3. Developer Newsletter
          # Official Discord Developer Newsletter
          # ----------------------------------------------------------
          try:
              page = fetch(
                  "https://discord.com/developers/developer-newsletter"
              )

              url = find_link(
                  page,
                  r"/developer-newsletter/[^\"'#?]+"
              )

              if url:
                  details = article_details(url)

                  sources["developer_news"] = {
                      "found": True,
                      "url": url,
                      "title": details["title"],
                      "description": details["description"],
                      "image": details["image"],
                      "id": sha(url),
                      "source": "Discord Developer Newsletter",
                      "type": "Developer News",
                  }

          except Exception as e:
              print("Developer Newsletter discovery failed:", e)

          # ----------------------------------------------------------
          # 4. Official Discord Developer Docs GitHub repository
          # ----------------------------------------------------------
          try:
              repo = "discord/discord-api-docs"

              commits = fetch_json(
                  f"https://api.github.com/repos/{repo}/commits?per_page=1"
              )

              latest = commits[0]

              commit_sha = latest["sha"]

              commit = fetch_json(
                  f"https://api.github.com/repos/{repo}/commits/{commit_sha}"
              )

              message = commit["commit"]["message"].strip()
              subject = message.splitlines()[0].strip()

              author = (
                  commit.get("author", {}).get("login")
                  or commit["commit"].get("author", {}).get("name")
                  or "Unknown"
              )

              commit_url = commit["html_url"]

              files = [
                  item.get("filename", "")
                  for item in commit.get("files", [])
                  if item.get("filename")
              ]

              combined = (
                  message
                  + "\n"
                  + "\n".join(files)
              ).lower()

              # --------------------------------------------------------
              # Classification priority:
              # Breaking > Social SDK > API > Docs
              # --------------------------------------------------------

              if any(
                  term in combined
                  for term in [
                      "breaking change",
                      "breaking-change",
                      "breaking:",
                      "deprecated",
                      "deprecation",
                      "deprecate",
                      "removed",
                      "removal",
                      "remove endpoint",
                  ]
              ):
                  category = "breaking"
                  category_name = "Breaking Changes"

              elif any(
                  path.startswith("resources/discord-social-sdk/")
                  or path.startswith("developers/discord-social-sdk/")
                  for path in files
              ):
                  category = "social_sdk"
                  category_name = "Social SDK"

              elif any(
                  path == "developers/reference.mdx"
                  or path.startswith("developers/reference/")
                  or path.startswith("developers/resources/")
                  or path.startswith("developers/events/")
                  or path.startswith("developers/topics/")
                  or path.startswith("developers/components/")
                  or path == "developers/change-log.mdx"
                  for path in files
              ):
                  category = "api"
                  category_name = "API Updates"

              else:
                  category = "docs"
                  category_name = "Docs Updates"

              file_text = "\n".join(files[:12])

              if len(files) > 12:
                  file_text += f"\n+ {len(files) - 12} more files"

              github_item = {
                  "found": True,
                  "url": commit_url,
                  "title": subject or "Discord Developer Documentation Update",
                  "description": (
                      "An official update was published in the "
                      "Discord Developer Documentation."
                  ),
                  "image": "",
                  "id": commit_sha,
                  "source": "Discord Developer Documentation",
                  "type": category_name,
                  "author": author,
                  "commit": commit_sha[:12],
                  "files": file_text,
                  "category": category,
              }

              # Only activate the room that owns this commit.
              for key in [
                  "api",
                  "docs",
                  "social_sdk",
                  "breaking",
              ]:
                  sources[key] = {
                      "found": False
                  }

              sources[category] = github_item

          except Exception as e:
              print("GitHub discovery failed:", e)

          # ----------------------------------------------------------
          # Guarantee all seven keys exist.
          # ----------------------------------------------------------
          for key in [
              "changelog",
              "patch_notes",
              "developer_news",
              "api",
              "docs",
              "social_sdk",
              "breaking",
          ]:
              if key not in sources:
                  sources[key] = {
                      "found": False
                  }

          with open("sources.json", "w", encoding="utf-8") as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # GitHub Actions outputs.
          output_file = os.environ["GITHUB_OUTPUT"]

          with open(output_file, "a", encoding="utf-8") as out:
              for key in [
                  "changelog",
                  "patch_notes",
                  "developer_news",
                  "api",
                  "docs",
                  "social_sdk",
                  "breaking",
              ]:
                  item = sources.get(key, {})
                  found = "true" if item.get("found") else "false"
                  item_id = item.get("id", "")

                  out.write(f"{key}_found={found}\n")
                  out.write(f"{key}_id={item_id}\n")

          print(json.dumps(sources, ensure_ascii=False, indent=2))
          PY

      # ------------------------------------------------------------
      # Prepare sender
      # ------------------------------------------------------------
      - name: Prepare Components V2 sender
        run: |
          cat > send_v2.py <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          SOURCE_KEY = sys.argv[1]
          WEBHOOK = os.environ["WEBHOOK_URL"]

          with open("sources.json", "r", encoding="utf-8") as f:
              sources = json.load(f)

          item = sources.get(SOURCE_KEY, {})

          if not item.get("found"):
              print(f"No source found for {SOURCE_KEY}")
              sys.exit(0)

          title = item.get("title", "Official Discord Update")
          description = item.get("description", "")
          url = item.get("url", "")
          source = item.get("source", "Discord")
          item_type = item.get("type", SOURCE_KEY)
          image = item.get("image", "")
          author = item.get("author", "")
          commit = item.get("commit", "")
          files = item.get("files", "")

          if not description:
              description = (
                  "An official update was published by Discord."
              )

          # Keep the visible text safely below Discord's V2 text budget.
          description = description[:1800]
          title = title[:250]

          metadata = (
              f"**Source**\n"
              f"{source}\n\n"
              f"**Type**\n"
              f"{item_type}"
          )

          if author:
              metadata += (
                  f"\n\n**Author**\n"
                  f"{author}"
              )

          if commit:
              metadata += (
                  f"\n\n**Commit**\n"
                  f"`{commit}`"
              )

          if files:
              metadata += (
                  f"\n\n**Changed Files**\n"
                  f"```text\n{files[:900]}\n```"
              )

          components_inside = [
              {
                  "type": 10,
                  "content": f"# {title}\n\n{description}"
              },
              {
                  "type": 14,
                  "divider": True,
                  "spacing": 1
              },
              {
                  "type": 10,
                  "content": metadata
              }
          ]

          # Add official article image when available.
          if image:
              components_inside.append(
                  {
                      "type": 12,
                      "items": [
                          {
                              "media": {
                                  "url": image
                              }
                          }
                      ]
                  }
              )

          components_inside.extend(
              [
                  {
                      "type": 14,
                      "divider": True,
                      "spacing": 1
                  },
                  {
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "Open Official Update",
                              "url": url
                          }
                      ]
                  }
              ]
          )

          payload = {
              # This is the webhook display username.
              # It intentionally does NOT contain the word "Discord".
              "username": {
                  "changelog": "Changelog Updates",
                  "patch_notes": "Patch Notes",
                  "developer_news": "Developer News",
                  "api": "API Updates",
                  "docs": "Docs Updates",
                  "social_sdk": "Social SDK",
                  "breaking": "Breaking Changes"
              }.get(SOURCE_KEY, "Docs Updates"),

              # IS_COMPONENTS_V2 = 1 << 15
              "flags": 32768,

              "components": [
                  {
                      "type": 17,
                      "accent_color": 5793266,
                      "components": components_inside
                  }
              ]
          }

          # Discord requires with_components=true for webhook V2.
          separator = "&" if "?" in WEBHOOK else "?"
          endpoint = (
              WEBHOOK
              + separator
              + "with_components=true"
              + "&wait=true"
          )

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              endpoint,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordDocsNews/1.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  body = response.read().decode(
                      "utf-8",
                      "ignore"
                  )

                  print(
                      f"{SOURCE_KEY}: HTTP {response.status}"
                  )

                  if body:
                      print(body)

          except urllib.error.HTTPError as e:
              body = e.read().decode(
                  "utf-8",
                  "ignore"
              )

              print(
                  f"{SOURCE_KEY}: HTTP {e.code}"
              )
              print(body)

              sys.exit(1)
          PY

      # ============================================================
      # CHANGELOG
      # ============================================================
      - name: Restore changelog state
        if: steps.sources.outputs.changelog_found == 'true'
        id: cache_changelog
        uses: actions/cache/restore@v6
        with:
          path: .state/changelog
          key: discord-changelog-${{ steps.sources.outputs.changelog_id }}
          restore-keys: |
            discord-changelog-

      - name: Create changelog state directory
        if: steps.sources.outputs.changelog_found == 'true' && steps.cache_changelog.outputs.cache-hit != 'true'
        run: mkdir -p .state/changelog

      - name: Send changelog
        if: steps.sources.outputs.changelog_found == 'true' && steps.cache_changelog.outputs.cache-hit != 'true'
   
