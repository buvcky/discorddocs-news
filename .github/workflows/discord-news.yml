name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-${{ github.run_id }}
          restore-keys: |
            discord-news-

      - name: Fetch and send updates
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -euo pipefail

          cat > /tmp/discord_news.py <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from html import unescape

          STATE = Path(".discord-state")
          STATE.mkdir(exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 DiscordDocsNews/6.0",
              "Accept": "text/html,application/xhtml+xml,*/*",
          }


          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=45
                  ) as response:
                      return response.read().decode(
                          "utf-8",
                          "replace"
                      )
              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8",
                      "replace"
                  )
                  raise RuntimeError(
                      "HTTP {} while fetching {}: {}".format(
                          error.code,
                          url,
                          body[:500]
                      )
                  )


          def clean(value):
              value = unescape(value or "")

              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def get_meta(html, key):
              pattern1 = (
                  r'<meta\b[^>]*(?:property|name)=["\']'
                  + re.escape(key)
                  + r'["\'][^>]*content=["\']([^"\']+)["\']'
              )

              pattern2 = (
                  r'<meta\b[^>]*content=["\']([^"\']+)["\']'
                  r'[^>]*(?:property|name)=["\']'
                  + re.escape(key)
                  + r'["\']'
              )

              match = re.search(
                  pattern1,
                  html,
                  flags=re.I
              )

              if match:
                  return unescape(
                      match.group(1)
                  ).strip()

              match = re.search(
                  pattern2,
                  html,
                  flags=re.I
              )

              if match:
                  return unescape(
                      match.group(1)
                  ).strip()

              return ""


          def get_links(html, base):
              pattern = re.compile(
                  r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>'
                  r'(.*?)'
                  r'</a>',
                  flags=re.I | re.S
              )

              result = []

              for href, body in pattern.findall(html):
                  title = clean(body)

                  if not title:
                      continue

                  url = urllib.parse.urljoin(
                      base,
                      unescape(href)
                  )

                  if url.startswith(
                      "https://discord.com/"
                  ):
                      result.append(
                          (url, title)
                      )

              return result


          def get_article(url):
              html = fetch(url)

              title = get_meta(
                  html,
                  "og:title"
              )

              if not title:
                  match = re.search(
                      r"<h1\b[^>]*>(.*?)</h1>",
                      html,
                      flags=re.I | re.S
                  )

                  if match:
                      title = clean(
                          match.group(1)
                      )
                  else:
                      title = "Discord Update"

              date = get_meta(
                  html,
                  "article:published_time"
              )

              if date:
                  date = date[:10]

              article_match = re.search(
                  r"<article\b[^>]*>(.*?)</article>",
                  html,
                  flags=re.I | re.S
              )

              if article_match:
                  body = article_match.group(1)
              else:
                  main_match = re.search(
                      r"<main\b[^>]*>(.*?)</main>",
                      html,
                      flags=re.I | re.S
                  )

                  if main_match:
                      body = main_match.group(1)
                  else:
                      body = html

              body = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<(nav|header|footer)\b[^>]*>.*?</\1>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<li\b[^>]*>",
                  "\n- ",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"</(h[1-6]|p|li|blockquote|pre|div|section)>",
                  "\n\n",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<[^>]+>",
                  " ",
                  body
              )

              body = unescape(body)

              lines = []

              for line in body.splitlines():
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  ).strip()

                  if not line:
                      continue

                  if lines and line == lines[-1]:
                      continue

                  lines.append(line)

              content = "\n\n".join(
                  lines
              ).strip()

              if title:
                  content = re.sub(
                      r"^" + re.escape(title),
                      "",
                      content,
                      count=1,
                      flags=re.I
                  ).strip()

              image = get_meta(
                  html,
                  "og:image"
              )

              if image:
                  image = urllib.parse.urljoin(
                      url,
                      image
                  )

              return {
                  "title": title,
                  "date": date,
                  "url": url,
                  "content": content,
                  "image": image
              }


          def latest_blog(tag_url, keyword):
              html = fetch(tag_url)

              for url, title in get_links(
                  html,
                  tag_url
              ):
                  if "/blog/" not in url:
                      continue

                  if keyword.lower() not in title.lower():
                      continue

                  return get_article(url)

              raise RuntimeError(
                  "Could not find {} on {}".format(
                      keyword,
                      tag_url
                  )
              )


          def latest_newsletter():
              page = (
                  "https://discord.com/"
                  "developers/developer-newsletter"
              )

              html = fetch(page)

              for url, title in get_links(
                  html,
                  page
              ):
                  if "/developer-newsletter/" in url:
                      return get_article(url)

              raise RuntimeError(
                  "Could not find developer newsletter"
              )


          def developer_changelog():
              url = (
                  "https://discord.com/"
                  "developers/docs/change-log"
              )

              html = fetch(url)

              main = re.search(
                  r"<main\b[^>]*>(.*?)</main>",
                  html,
                  flags=re.I | re.S
              )

              if main:
                  body = main.group(1)
              else:
                  body = html

              body = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<(nav|header|footer)\b[^>]*>.*?</\1>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"</(h[1-6]|p|li|div|section|article)>",
                  "\n\n",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<li\b[^>]*>",
                  "\n- ",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<[^>]+>",
                  " ",
                  body
              )

              body = unescape(body)

              lines = []

              for line in body.splitlines():
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  ).strip()

                  if line:
                      lines.append(line)

              return {
                  "title": "Discord Developer Changelog",
                  "date": "",
                  "url": url,
                  "content": "\n\n".join(lines),
                  "image": ""
              }


          def find_topic(source, words, title):
              content = source["content"]
              lower = content.lower()

              position = -1

              for word in words:
                  found = lower.find(
                      word.lower()
                  )

                  if found >= 0:
                      if position == -1:
                          position = found
                      else:
                          position = min(
                              position,
                              found
                          )

              if position == -1:
                  return None

              start = max(
                  0,
                  position - 1000
              )

              end = min(
                  len(content),
                  position + 4500
              )

              return {
                  "title": title,
                  "date": "",
                  "url": source["url"],
                  "content": content[start:end],
                  "image": ""
              }


          def split_text(content):
              limit = 3500
              paragraphs = content.split(
                  "\n\n"
              )

              result = []
              current = ""

              for paragraph in paragraphs:
                  paragraph = paragraph.strip()

                  if not paragraph:
                      continue

                  candidate = (
                      paragraph
                      if not current
                      else current
                      + "\n\n"
                      + paragraph
                  )

                  if len(candidate) <= limit:
                      current = candidate
                      continue

                  if current:
                      result.append(current)

                  while len(paragraph) > limit:
                      cut = paragraph.rfind(
                          " ",
                          0,
                          limit
                      )

                      if cut < 500:
                          cut = limit

                      result.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = paragraph[
                          cut:
                      ].strip()

                  current = paragraph

              if current:
                  result.append(current)

              return result or [""]


          def send(category, item, secret):
              if item is None:
                  print(
                      "{}: no update found".format(
                          category
                      )
                  )
                  return

              webhook = os.environ.get(
                  secret,
                  ""
              ).strip()

              if not webhook:
                  raise RuntimeError(
                      "{} is empty".format(
                          secret
                      )
                  )

              fingerprint = hashlib.sha256(
                  (
                      item["url"]
                      + "|"
                      + item["title"]
                      + "|"
                      + item["date"]
                      + "|"
                      + item["content"]
                  ).encode("utf-8")
              ).hexdigest()

              state_file = STATE / (
                  category + ".state"
              )

              if state_file.exists():
                  old = state_file.read_text(
                      encoding="utf-8"
                  ).strip()

                  if old == fingerprint:
                      print(
                          "{}: already sent".format(
                              category
                          )
                      )
                      return

              parts = split_text(
                  item["content"]
              )

              print(
                  "{}: {} part(s)".format(
                      category,
                      len(parts)
                  )
              )

              for index, part in enumerate(
                  parts
              ):
                  components = []

                  if (
                      index == 0
                      and item["image"]
                  ):
                      components.append({
                          "type": 12,
                          "items": [
                              {
                                  "type": 1,
                                  "media": {
                                      "url": item[
                                          "image"
                                      ]
                                  }
                              }
                          ]
                      })

                  components.append({
                      "type": 10,
                      "content": (
                          "# " + item["title"]
                      )
                  })

                  if item["date"]:
                      components.append({
                          "type": 10,
                          "content": (
                              "**Published:** "
                              + item["date"]
                          )
                      })

                  components.append({
                      "type": 14,
                      "spacing": 1
                  })

                  components.append({
                      "type": 10,
                      "content": part
                  })

                  components.append({
                      "type": 14,
                      "spacing": 1
                  })

                  components.append({
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "View Source",
                              "url": item["url"]
                          }
                      ]
                  })

                  payload = {
                      "flags": 32768,
                      "components": [
                          {
                              "type": 17,
                              "components": components
                          }
                      ]
                  }

                  data = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

                  request = urllib.request.Request(
                      webhook
                      + "?with_components=true&wait=true",
                      data=data,
                      headers={
                          "Content-Type":
                              "application/json",
                          "User-Agent":
                              "DiscordDocsNews/6.0"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:
                          response.read()

                          print(
                              "{}: sent {}/{} HTTP {}".format(
                                  category,
                                  index + 1,
                                  len(parts),
                                  response.status
                              )
                          )

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          "replace"
                      )

                      raise RuntimeError(
                          "{}: Discord HTTP {}: {}".format(
                              category,
                              error.code,
                              body[:1000]
                          )
                      )

              state_file.write_text(
                  fingerprint,
                  encoding="utf-8"
              )

              print(
                  "{}: state saved".format(
                      category
              
