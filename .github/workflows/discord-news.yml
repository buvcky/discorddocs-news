name: Discord Official News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  discord-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore update state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-state-${{ github.run_id }}
          restore-keys: |
            discord-news-state-

      - name: Discover official updates
        run: |
          cat > discover.py <<'PY'
          import json
          import re
          import html
          import urllib.request
          import urllib.parse

          UA = "DiscordDocsNews/3.0"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": UA}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          def clean(text):
              text = html.unescape(text or "")
              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.S | re.I
              )
              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.S | re.I
              )
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )
              return text.strip()

          def page_info(url):
              raw = get(url)

              title = ""
              image = ""

              patterns = [
                  r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:title["\']'
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      raw,
                      re.I
                  )
                  if match:
                      title = html.unescape(
                          match.group(1)
                      ).strip()
                      break

              if not title:
                  match = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      raw,
                      re.S | re.I
                  )
                  if match:
                      title = clean(
                          match.group(1)
                      )

              image_patterns = [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']'
              ]

              for pattern in image_patterns:
                  match = re.search(
                      pattern,
                      raw,
                      re.I
                  )
                  if match:
                      image = html.unescape(
                          match.group(1)
                      ).strip()
                      break

              if image.startswith("/"):
                  image = "https://discord.com" + image

              return {
                  "title": title,
                  "image": image,
                  "text": clean(raw)
              }

          def links(raw, pattern):
              result = []

              for url in re.findall(
                  pattern,
                  raw,
                  re.I
              ):
                  url = html.unescape(
                      url
                  ).rstrip(".,)")

                  if url not in result:
                      result.append(url)

              return result

          sources = {}

          try:
              blog = get(
                  "https://discord.com/blog"
              )
          except Exception:
              blog = ""

          try:
              patch = get(
                  "https://discord.com/tags/patch-notes"
              )
          except Exception:
              patch = ""

          try:
              newsletter = get(
                  "https://discord.com/developers/developer-newsletter"
              )
          except Exception:
              newsletter = ""

          changelog_links = links(
              blog,
              r'https://discord\.com/blog/discord-update-[^"\'<>\s]+'
          )

          if changelog_links:
              url = changelog_links[0]

              try:
                  info = page_info(url)

                  sources["changelog"] = {
                      "found": True,
                      "title": info["title"][:250],
                      "description": info["text"][:1800],
                      "source": "Discord Blog",
                      "type": "Changelog",
                      "url": url,
                      "image": info["image"]
                  }
              except Exception:
                  sources["changelog"] = {
                      "found": False
                  }
          else:
              sources["changelog"] = {
                  "found": False
              }

          patch_links = links(
              patch,
              r'https://discord\.com/blog/discord-patch-notes-[^"\'<>\s]+'
          )

          if patch_links:
              url = patch_links[0]

              try:
                  info = page_info(url)

                  sources["patch_notes"] = {
                      "found": True,
                      "title": info["title"][:250],
                      "description": info["text"][:1800],
                      "source": "Discord Patch Notes",
                      "type": "Patch Notes",
                      "url": url,
                      "image": info["image"]
                  }
              except Exception:
                  sources["patch_notes"] = {
                      "found": False
                  }
          else:
              sources["patch_notes"] = {
                  "found": False
              }

          newsletter_links = links(
              newsletter,
              r'https://discord\.com/developer-newsletter/[^"\'<>\s]+'
          )

          if newsletter_links:
              url = newsletter_links[0]

              try:
                  info = page_info(url)

                  sources["developer_news"] = {
                      "found": True,
                      "title": info["title"][:250],
                      "description": info["text"][:1800],
                      "source": "Discord Developer Newsletter",
                      "type": "Developer News",
                      "url": url,
                      "image": info["image"]
                  }
              except Exception:
                  sources["developer_news"] = {
                      "found": False
                  }
          else:
              sources["developer_news"] = {
                  "found": False
              }

          def github_get(url):
              try:
                  return json.loads(
                      get(url)
                  )
              except Exception:
                  return None

          def commits(
              path=None,
              count=20
          ):
              url = (
                  "https://api.github.com/repos/"
                  "discord/discord-api-docs/commits"
              )

              params = {
                  "per_page": count
              }

              if path:
                  params["path"] = path

              url += "?" + urllib.parse.urlencode(
                  params
              )

              data = github_get(url)

              if isinstance(data, list):
                  return data

              return []

          def commit_detail(sha):
              return github_get(
                  "https://api.github.com/repos/"
                  "discord/discord-api-docs/commits/"
                  + sha
              ) or {}

          def make_commit_item(
              commit,
              item_type
          ):
              sha = commit.get(
                  "sha",
                  ""
              )

              commit_data = commit.get(
                  "commit",
                  {}
              )

              message = commit_data.get(
                  "message",
                  ""
              ).strip()

              author = (
                  commit_data
                  .get("author", {})
                  .get("name", "Discord")
              )

              detail = commit_detail(
                  sha
              )

              files = detail.get(
                  "files",
                  []
              )

              filenames = [
                  item.get(
                      "filename",
                      ""
                  )
                  for item in files
              ]

              url = (
                  "https://github.com/discord/"
                  "discord-api-docs/commit/"
                  + sha
              )

              if not message:
                  message = (
                      "A new official Discord API "
                      "documentation update was published."
                  )

              return {
                  "found": True,
                  "title": message.splitlines()[0][:250],
                  "description": message[:1800],
                  "source": "Discord API Docs",
                  "type": item_type,
                  "url": url,
                  "image": (
                      "https://opengraph.githubassets.com/1/"
                      "discord/discord-api-docs/commit/"
                      + sha
                  ),
                  "author": author,
                  "commit": sha[:12],
                  "files": "\n".join(
                      filenames[:20]
                  ),
                  "_id": sha
              }

          api_paths = [
              "developers/reference.mdx",
              "developers/reference",
              "developers/resources",
              "developers/events",
              "developers/topics",
              "developers/components",
              "developers/change-log.mdx"
          ]

          api_commit = None

          for path in api_paths:
              found = commits(
                  path,
                  5
              )

              if found:
                  api_commit = found[0]
                  break

          if api_commit:
              sources["api"] = make_commit_item(
                  api_commit,
                  "API Update"
              )
          else:
              sources["api"] = {
                  "found": False
              }

          docs_commits = commits(
              "developers",
              20
          )

          docs_commit = None

          for commit in docs_commits:
              message = (
                  commit
                  .get("commit", {})
                  .get("message", "")
                  .lower()
              )

              if not any(
                  word in message
                  for word in [
                      "breaking",
                      "deprecated",
                      "deprecation",
                      "removal",
                      "removed"
                  ]
              ):
                  docs_commit = commit
                  break

          if docs_commit:
              sources["docs"] = make_commit_item(
                  docs_commit,
                  "Documentation Update"
              )
          else:
              sources["docs"] = {
                  "found": False
              }

          social_commits = []

          for path in [
              "resources/discord-social-sdk",
              "developers/discord-social-sdk"
          ]:
              social_commits.extend(
                  commits(
                      path,
                      10
                  )
              )

          if social_commits:
              social_commits.sort(
                  key=lambda item:
                      item.get("commit", {})
                      .get("author", {})
                      .get("date", ""),
                  reverse=True
              )

              sources["social_sdk"] = make_commit_item(
                  social_commits[0],
                  "Social SDK"
              )
          else:
              sources["social_sdk"] = {
                  "found": False
              }

          all_commits = commits(
              None,
              50
          )

          breaking_commit = None

          for commit in all_commits:
              message = (
                  commit
                  .get("commit", {})
                  .get("message", "")
                  .lower()
              )

              if any(
                  word in message
                  for word in [
                      "breaking",
                      "deprecated",
                      "deprecation",
                      "removal",
                      "removed"
                  ]
              ):
                  breaking_commit = commit
                  break

          if breaking_commit:
              sources["breaking"] = make_commit_item(
                  breaking_commit,
                  "Breaking Change"
              )
          else:
              sources["breaking"] = {
                  "found": False
              }

          with open(
              "sources.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  sources,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  sources,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          python3 discover.py

      - name: Create Components V2 sender
        run: |
          cat > send.py <<'PY'
          import json
          import os
          import sys
          import uuid
          import urllib.request
          import urllib.error

          category = sys.argv[1]
          webhook = os.environ["WEBHOOK_URL"]

          with open(
              "sources.json",
              "r",
              encoding="utf-8"
          ) as file:
              sources = json.load(file)

          item = sources.get(
              category
          )

          if not item or not item.get("found"):
              print(
                  f"No official update found for {category}"
              )
              sys.exit(0)

          os.makedirs(
              ".discord-state",
              exist_ok=True
          )

          state_file = os.path.join(
              ".discord-state",
              f"{category}.state"
          )

          source_id = (
              item.get("_id")
              or item.get("url")
              or item.get("title")
          )

          old_id = ""

          if os.path.exists(
              state_file
          ):
              with open(
                  state_file,
                  "r",
                  encoding="utf-8"
              ) as file:
                  old_id = file.read().strip()

          if old_id == source_id:
              print(
                  f"No new update for {category}"
              )
              sys.exit(0)

          title = item.get(
              "title",
              "Official Discord Update"
          )[:250]

          description = item.get(
              "description",
              "An official Discord update was published."
          )[:1800]

          source = item.get(
              "source",
              "Discord"
          )

          item_type = item.get(
              "type",
              category
          )

          url = item.get(
              "url",
              ""
          )

          image_url = item.get(
              "image",
              ""
          )

          if not (
              image_url.startswith(
                  "https://"
              )
              or image_url.startswith(
                  "http://"
              )
          ):
              image_url = ""

          info = (
              f"**Source**\n"
              f"{source}\n\n"
              f"**Type**\n"
              f"{item_type}"
          )

          if item.get("author"):
              info += (
                  "\n\n**Author**\n"
                  + item["author"]
              )

          if item.get("commit"):
              info += (
                  "\n\n**Commit**\n"
                  f"`{item['commit']}`"
              )

          if item.get("files"):
              info += (
                  "\n\n**Changed Files**\n"
                  "```text\n"
                  + item["files"][:700]
                  + "\n```"
              )

          username = {
              "patch_notes": "Discoɾd Patch Notes",
              "developer_news": "Discoɾd Developer News",
              "changelog": "Discoɾd Changelog",
              "social_sdk": "Discoɾd Social SDK",
              "docs": "Discoɾd Docs Updates",
              "api": "Discoɾd API Updates",
              "breaking": "Discoɾd Breaking Changes"
          }.get(
              category,
              "Discoɾd Docs Updates"
          )

          components = []

          container_components = []

          if image_url:
              container_components.append({
                  "type": 12,
                  "items": [
                      {
                          "media": {
                              "url": image_url
                          },
                          "description": (
                              f"{title} image"
                          )[:1024]
                      }
                  ]
              })

          container_components.append({
              "type": 14,
              "divider": True,
              "spacing": 1
          })

          container_components.append({
              "type": 10,
              "content": (
                  f"# {title}\n\n"
                  f"{description}"
              )
          })

          container_components.append({
              "type": 14,
              "divider": True,
              "spacing": 1
          })

          section = {
              "type": 9,
              "components": [
                  {
                      "type": 10,
                      "content": info[:1800]
                  }
              ]
          }

          if image_url:
              section["accessory"] = {
                  "type": 11,
                  "media": {
                      "url": image_url
                  },
                  "description": (
                      "Official update"
                  )
              }

          container_components.append(
              section
          )

          container_components.append({
              "type": 14,
              "divider": True,
              "spacing": 1
          })

          container_components.append({
              "type": 1,
              "components": [
                  {
                      "type": 2,
                      "style": 5,
                      "label": "Open Official Update",
                      "url": url
                  }
              ]
          })

          components.append({
              "type": 17,
              "accent_color": 5793266,
              "components": container_components
          })

          payload = {
              "username": username,
              "flags": 32768,
              "components": components
          }

          boundary = (
              "----DiscordDocs"
