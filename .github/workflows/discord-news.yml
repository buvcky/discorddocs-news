name: Discord Official News

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send the latest update immediately"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  discord-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-${{ github.run_id }}
          restore-keys: |
            discord-news-

      - name: Discover latest official updates
        run: |
          cat > discover.py <<'PY'
          import json
          import re
          import html
          import urllib.request
          import urllib.parse

          UA = "DiscordDocsNews/4.0"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "text/html,application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      "ignore"
                  )

          def clean(text):
              text = html.unescape(
                  text or ""
              )

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          def absolute_url(url):
              if not url:
                  return ""

              url = html.unescape(
                  url
              ).strip()

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("/"):
                  return "https://discord.com" + url

              return url

          def extract_meta(raw, name):
              patterns = [
                  rf'<meta[^>]+property=["\']{re.escape(name)}["\'][^>]+content=["\']([^"\']+)',
                  rf'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']{re.escape(name)}["\']'
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      raw,
                      re.I
                  )

                  if match:
                      return html.unescape(
                          match.group(1)
                      ).strip()

              return ""

          def page_info(url):
              raw = get(url)

              title = extract_meta(
                  raw,
                  "og:title"
              )

              image = extract_meta(
                  raw,
                  "og:image"
              )

              description = extract_meta(
                  raw,
                  "og:description"
              )

              if not title:
                  match = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      raw,
                      re.S | re.I
                  )

                  if match:
                      title = clean(
                          match.group(1)
                      )

              if not description:
                  description = clean(
                      raw
                  )

              image = absolute_url(
                  image
              )

              return {
                  "title": title,
                  "image": image,
                  "description": description
              }

          def find_blog_links(
              raw,
              prefix
          ):
              found = set()

              patterns = [
                  rf'https://discord\.com/blog/{prefix}[^"\'<>\s?#]+',
                  rf'/blog/{prefix}[^"\'<>\s?#]+'
              ]

              for pattern in patterns:
                  for match in re.findall(
                      pattern,
                      raw,
                      re.I
                  ):
                      url = absolute_url(
                          match
                      )

                      url = url.rstrip(
                          ".,);"
                      )

                      found.add(url)

              return list(found)

          def latest_blog_update():
              raw = get(
                  "https://discord.com/blog"
              )

              links = find_blog_links(
                  raw,
                  "discord-update-"
              )

              if not links:
                  raise RuntimeError(
                      "Could not find Discord changelog"
                  )

              dated = []

              for url in links:
                  match = re.search(
                      r"discord-update-(\d{4}-\d{2}-\d{2})",
                      url
                  )

                  if match:
                      dated.append(
                          (
                              match.group(1),
                              url
                          )
                      )

              if dated:
                  dated.sort(
                      reverse=True
                  )

                  return dated[0][1]

              return links[0]

          def latest_patch_notes():
              raw = get(
                  "https://discord.com/tags/patch-notes"
              )

              links = find_blog_links(
                  raw,
                  "discord-patch-notes-"
              )

              if not links:
                  raise RuntimeError(
                      "Could not find Discord patch notes"
                  )

              dated = []

              for url in links:
                  match = re.search(
                      r"discord-patch-notes-(\d{4}-\d{2}-\d{2})",
                      url
                  )

                  if match:
                      dated.append(
                          (
                              match.group(1),
                              url
                          )
                      )

              if dated:
                  dated.sort(
                      reverse=True
                  )

                  return dated[0][1]

              return links[0]

          def latest_newsletter():
              raw = get(
                  "https://discord.com/developers/developer-newsletter"
              )

              links = re.findall(
                  r'https://discord\.com/developer-newsletter/[^"\'<>\s?#]+',
                  raw,
                  re.I
              )

              links = list(
                  dict.fromkeys(
                      links
                  )
              )

              if not links:
                  raise RuntimeError(
                      "Could not find developer newsletter"
                  )

              dated = []

              for url in links:
                  match = re.search(
                      r"/developer-newsletter/(\d{4}-\d{2}-\d{2})",
                      url
                  )

                  if match:
                      dated.append(
                          (
                              match.group(1),
                              url
                          )
                      )

              if dated:
                  dated.sort(
                      reverse=True
                  )

                  return dated[0][1]

              return links[0]

          sources = {}

          try:
              url = latest_blog_update()
              info = page_info(url)

              sources["changelog"] = {
                  "found": True,
                  "title": info["title"][:250],
                  "description": info["description"][:1800],
                  "source": "Discord Blog",
                  "type": "Changelog",
                  "url": url,
                  "image": info["image"],
                  "id": url
              }

          except Exception as error:
              print(
                  "Changelog error:",
                  error
              )

              sources["changelog"] = {
                  "found": False
              }

          try:
              url = latest_patch_notes()
              info = page_info(url)

              sources["patch_notes"] = {
                  "found": True,
                  "title": info["title"][:250],
                  "description": info["description"][:1800],
                  "source": "Discord Patch Notes",
                  "type": "Patch Notes",
                  "url": url,
                  "image": info["image"],
                  "id": url
              }

          except Exception as error:
              print(
                  "Patch Notes error:",
                  error
              )

              sources["patch_notes"] = {
                  "found": False
              }

          try:
              url = latest_newsletter()
              info = page_info(url)

              sources["developer_news"] = {
                  "found": True,
                  "title": info["title"][:250],
                  "description": info["description"][:1800],
                  "source": "Discord Developer Newsletter",
                  "type": "Developer News",
                  "url": url,
                  "image": info["image"],
                  "id": url
              }

          except Exception as error:
              print(
                  "Developer News error:",
                  error
              )

              sources["developer_news"] = {
                  "found": False
              }

          def github_get(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": UA,
                          "Accept": "application/vnd.github+json"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:
                      return json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

              except Exception as error:
                  print(
                      "GitHub error:",
                      error
                  )

                  return None

          def get_commits(
              path=None,
              count=20
          ):
              base = (
                  "https://api.github.com/repos/"
                  "discord/discord-api-docs/commits"
              )

              params = {
                  "per_page": count
              }

              if path:
                  params["path"] = path

              url = (
                  base
                  + "?"
                  + urllib.parse.urlencode(
                      params
                  )
              )

              data = github_get(
                  url
              )

              if isinstance(
                  data,
                  list
              ):
                  return data

              return []

          def commit_details(sha):
              return github_get(
                  "https://api.github.com/repos/"
                  "discord/discord-api-docs/commits/"
                  + sha
              ) or {}

          def make_commit(
              commit,
              item_type
          ):
              sha = commit.get(
                  "sha",
                  ""
              )

              data = commit.get(
                  "commit",
                  {}
              )

              message = data.get(
                  "message",
                  ""
              ).strip()

              if not message:
                  message = (
                      "A new official Discord "
                      "documentation update was published."
                  )

              author = (
                  data.get(
                      "author",
                      {}
                  ).get(
                      "name",
                      "Discord"
                  )
              )

              detail = commit_details(
                  sha
              )

              files = detail.get(
                  "files",
                  []
              )

              filenames = [
                  item.get(
                      "filename",
                      ""
                  )
                  for item in files
              ]

              url = (
                  "https://github.com/discord/"
                  "discord-api-docs/commit/"
                  + sha
              )

              return {
                  "found": True,
                  "title": message.splitlines()[0][:250],
                  "description": message[:1800],
                  "source": "Discord API Docs",
                  "type": item_type,
                  "url": url,
                  "image": (
                      "https://opengraph.githubassets.com/1/"
                      "discord/discord-api-docs/commit/"
                      + sha
                  ),
                  "author": author,
                  "commit": sha[:12],
                  "files": "\n".join(
                      filenames[:20]
                  ),
                  "id": sha
              }

          api_paths = [
              "developers/reference.mdx",
              "developers/reference",
              "developers/resources",
              "developers/events",
              "developers/topics",
              "developers/components",
              "developers/change-log.mdx"
          ]

          api_item = None

          for path in api_paths:
              commits = get_commits(
                  path,
                  5
              )

              if commits:
                  api_item = commits[0]
                  break

          if api_item:
              sources["api"] = make_commit(
                  api_item,
                  "API Update"
              )
          else:
              sources["api"] = {
                  "found": False
              }

          social_commits = []

          for path in [
              "resources/discord-social-sdk",
              "developers/discord-social-sdk"
          ]:
              social_commits.extend(
                  get_commits(
                      path,
                      10
                  )
              )

          if social_commits:
              social_commits.sort(
                  key=lambda item:
                      item.get(
                          "commit",
                          {}
                      ).get(
                          "author",
                          {}
                      ).get(
                          "date",
                          ""
                      ),
                  reverse=True
              )

              sources["social_sdk"] = make_commit(
                  social_commits[0],
                  "Social SDK"
              )
          else:
              sources["social_sdk"] = {
                  "found": False
              }

          docs_commits = get_commits(
              "developers",
              30
          )

          docs_item = None

          for commit in docs_commits:
              message = (
                  commit.get(
                      "commit",
                      {}
                  ).get(
                      "message",
                      ""
                  ).lower()
              )

              if not any(
                  word in message
                  for word in [
                      "breaking",
                      "deprecated",
                      "deprecation",
                      "removal",
                      "removed"
                  ]
              ):
                  docs_item = commit
                  break

          if docs_item:
              sources["docs"] = make_commit(
                  docs_item,
                  "Documentation Update"
              )
          else:
              sources["docs"] = {
                  "found": False
              }

          all_commits = get_commits(
              None,
              50
          )

          breaking_item = None

          for commit in all_commits:
              message = (
                  commit.get(
                      "commit",
                      {}
                  ).get(
                      "message",
                      ""
                  ).lower()
              )

              if any(
                  word in message
                  for word in [
                      "breaking",
                      "deprecated",
                      "deprecation",
                      "removal",
                      "removed"
                  ]
              ):
                  breaking_item = commit
                  break

          if breaking_item:
              sources["breaking"] = make_commit(
                  breaking_item,
                  "Breaking Change"
              )
          else:
              sources["breaking"] = {
                  "found": False
              }

          with open(
              "sources.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  sources,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("===== DISCOVERED UPDATES =====")

          for category, item in sources.items():
              if item.get("found"):
                  print(
                      category,
                      "->",
                      item.get("title")
                  )
              else:
                  print(
                      category,
                      "-> NOT FOUND"
                  )

          print(
              "=============================="
          )
          PY

          python3 discover.py

      - name: Send updates
        env:
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}
        run: |
          cat > send.py <<'PY'
          import json
          import os
          import sys
          import uuid
          import urllib.request
          import urllib.error

          category = sys.argv[1]
          webhook = os.environ.get(
              "WEBHOOK_URL",
              ""
          )

          force_send = (
              os.environ.get(
                  "FORCE_SEND",
                  "false"
              ).lower()
              == "true"
          )

          if not webhook:
              print(
                  f"{category}: WEBHOOK_URL
