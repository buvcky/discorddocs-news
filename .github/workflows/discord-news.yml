name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state-v4
          key: discord-news-v4-${{ github.run_id }}
          restore-keys: |
            discord-news-v4-

      - name: Install parser
        run: |
          python3 -m pip install --disable-pip-version-check --quiet beautifulsoup4

      - name: Fetch and send updates
        env:
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          cat > /tmp/discord_news.py <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from bs4 import BeautifulSoup, NavigableString, Tag

          STATE = Path(".discord-state-v4")
          STATE.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 DiscordDocsNews/9.0",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          MAX_TEXT = 3900
          MAX_PAYLOAD = 8000
          MAX_COMPONENTS = 8

          def fetch(url):
              request = urllib.request.Request(url, headers=HEADERS)

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.read().decode("utf-8", "replace")

              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise RuntimeError(
                      "HTTP {} while fetching {}: {}".format(
                          error.code,
                          url,
                          body[:1000]
                      )
                  )

          def absolute_url(base, value):
              if not value:
                  return ""

              return urllib.parse.urljoin(
                  base,
                  value.strip()
              )

          def clean_text(value):
              value = value or ""
              value = value.replace("\xa0", " ")
              value = re.sub(r"[ \t]+", " ", value)
              value = re.sub(r"\n{3,}", "\n\n", value)
              return value.strip()

          def split_text(text, limit=MAX_TEXT):
              text = text.strip()

              if not text:
                  return []

              if len(text) <= limit:
                  return [text]

              result = []
              remaining = text

              while len(remaining) > limit:
                  cut = remaining.rfind("\n\n", 0, limit)

                  if cut < 500:
                      cut = remaining.rfind("\n", 0, limit)

                  if cut < 500:
                      cut = remaining.rfind(" ", 0, limit)

                  if cut < 500:
                      cut = limit

                  part = remaining[:cut].strip()

                  if part:
                      result.append(part)

                  remaining = remaining[cut:].strip()

              if remaining:
                  result.append(remaining)

              return result

          def text_component(text):
              components = []

              for part in split_text(text):
                  if part:
                      components.append({
                          "type": 10,
                          "content": part
                      })

              return components

          def separator():
              return {
                  "type": 14,
                  "spacing": 1
              }

          def image_urls_from(tag, base_url):
              urls = []

              for img in tag.find_all("img"):
                  candidates = [
                      img.get("src"),
                      img.get("data-src"),
                      img.get("data-lazy-src"),
                      img.get("data-original")
                  ]

                  srcset = img.get("srcset")

                  if srcset:
                      for item in srcset.split(","):
                          value = item.strip().split(" ")[0]

                          if value:
                              candidates.append(value)

                  for candidate in candidates:
                      if not candidate:
                          continue

                      url = absolute_url(
                          base_url,
                          candidate
                      )

                      if (
                          url.startswith("http://")
                          or url.startswith("https://")
                      ):
                          if url not in urls:
                              urls.append(url)

              return urls

          def media_components(urls):
              urls = [
                  url for url in urls
                  if url
              ]

              result = []

              for start in range(0, len(urls), 10):
                  group = urls[start:start + 10]

                  if not group:
                      continue

                  result.append({
                      "type": 12,
                      "items": [
                          {
                              "type": 1,
                              "media": {
                                  "url": image
                              }
                          }
                          for image in group
                      ]
                  })

              return result

          def inline_markdown(node, base_url):
              if isinstance(node, NavigableString):
                  return str(node).replace("\xa0", " ")

              if not isinstance(node, Tag):
                  return ""

              name = node.name.lower()

              if name in (
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "img"
              ):
                  return ""

              if name == "br":
                  return "\n"

              if name == "a":
                  text = "".join(
                      inline_markdown(
                          child,
                          base_url
                      )
                      for child in node.children
                  )

                  text = clean_text(text)

                  href = absolute_url(
                      base_url,
                      node.get("href", "")
                  )

                  if href and text:
                      return "[{}]({})".format(
                          text,
                          href
                      )

                  return text

              if name in ("strong", "b"):
                  text = clean_text(
                      "".join(
                          inline_markdown(
                              child,
                              base_url
                          )
                          for child in node.children
                      )
                  )

                  return (
                      "**{}**".format(text)
                      if text
                      else ""
                  )

              if name in ("em", "i"):
                  text = clean_text(
                      "".join(
                          inline_markdown(
                              child,
                              base_url
                          )
                          for child in node.children
                      )
                  )

                  return (
                      "*{}*".format(text)
                      if text
                      else ""
                  )

              if name == "del":
                  text = clean_text(
                      "".join(
                          inline_markdown(
                              child,
                              base_url
                          )
                          for child in node.children
                      )
                  )

                  return (
                      "~~{}~~".format(text)
                      if text
                      else ""
                  )

              if name == "code":
                  text = node.get_text(
                      " ",
                      strip=True
                  )

                  return (
                      "`{}`".format(text)
                      if text
                      else ""
                  )

              result = "".join(
                  inline_markdown(
                      child,
                      base_url
                  )
                  for child in node.children
              )

              result = re.sub(
                  r"[ \t]+",
                  " ",
                  result
              )

              result = re.sub(
                  r" *\n *",
                  "\n",
                  result
              )

              return result

          def render_list(tag, base_url):
              ordered = tag.name.lower() == "ol"
              lines = []
              number = 1

              for li in tag.find_all(
                  "li",
                  recursive=False
              ):
                  text = inline_markdown(
                      li,
                      base_url
                  )

                  text = clean_text(text)

                  if not text:
                      continue

                  if ordered:
                      prefix = "{}. ".format(number)
                  else:
                      prefix = "- "

                  lines.append(
                      prefix + text
                  )

                  number += 1

              return "\n".join(lines)

          def render_blocks(parent, base_url):
              result = []

              for child in parent.children:
                  if isinstance(
                      child,
                      NavigableString
                  ):
                      text = clean_text(
                          str(child)
                      )

                      if text:
                          result.extend(
                              text_component(text)
                          )

                      continue

                  if not isinstance(child, Tag):
                      continue

                  name = child.name.lower()

                  if name in (
                      "script",
                      "style",
                      "noscript",
                      "nav",
                      "header",
                      "footer",
                      "svg"
                  ):
                      continue

                  if name in (
                      "h1",
                      "h2",
                      "h3",
                      "h4",
                      "h5",
                      "h6"
                  ):
                      text = clean_text(
                          inline_markdown(
                              child,
                              base_url
                          )
                      )

                      if text:
                          level = int(name[1])

                          if level <= 2:
                              prefix = "# "
                          elif level == 3:
                              prefix = "## "
                          else:
                              prefix = "### "

                          result.extend(
                              text_component(
                                  prefix + text
                              )
                          )

                      continue

                  if name in (
                      "p",
                      "div"
                  ):
                      images = image_urls_from(
                          child,
                          base_url
                      )

                      if images:
                          result.extend(
                              media_components(
                                  images
                              )
                          )

                      text = inline_markdown(
                          child,
                          base_url
                      )

                      text = clean_text(text)

                      if text:
                          result.extend(
                              text_component(text)
                          )

                      continue

                  if name in ("ul", "ol"):
                      text = render_list(
                          child,
                          base_url
                      )

                      if text:
                          result.extend(
                              text_component(text)
                          )

                      continue

                  if name == "blockquote":
                      text = clean_text(
                          inline_markdown(
                              child,
                              base_url
                          )
                      )

                      if text:
                          text = "\n".join(
                              "> " + line
                              for line in text.splitlines()
                              if line.strip()
                          )

                          result.extend(
                              text_component(text)
                          )

                      continue

                  if name == "pre":
                      code = child.get_text(
                          "\n",
                          strip=False
                      ).strip()

                      if code:
                          language = ""

                          code_node = child.find(
                              "code"
                          )

                          if code_node:
                              for cls in code_node.get(
                                  "class",
                                  []
                              ):
                                  if cls.startswith(
                                      "language-"
                                  ):
                                      language = cls[
                                          9:
                                      ]
                                      break

                          result.extend(
                              text_component(
                                  "```{}\n{}\n```".format(
                                      language,
                                      code
                                  )
                              )
                          )

                      continue

                  if name == "figure":
                      images = image_urls_from(
                          child,
                          base_url
                      )

                      if images:
                          result.extend(
                              media_components(
                                  images
                              )
                          )

                      caption = child.find(
                          "figcaption"
                      )

                      if caption:
                          caption_text = clean_text(
                              inline_markdown(
                                  caption,
                                  base_url
                              )
                          )

                          if caption_text:
                              result.extend(
                                  text_component(
                                      "*{}*".format(
                                          caption_text
                                      )
                                  )
                              )

                      continue

                  if name == "img":
                      images = image_urls_from(
                          child,
                          base_url
                      )

                      if images:
                          result.extend(
                              media_components(
                                  images
                              )
                          )

                      continue

                  if name == "hr":
                      result.append(
                          separator()
                      )
                      continue

                  if name == "table":
                      rows = []

                      for tr in child.find_all(
                          "tr"
                      ):
                          cells = []

                          for cell in tr.find_all(
                              ["th", "td"],
                              recursive=False
                          ):
                              value = clean_text(
                                  inline_markdown(
                                      cell,
                                      base_url
                                  )
                              )

                              value = value.replace(
                                  "|",
                                  "\\|"
                              )

                              cells.append(value)

                          if cells:
                              rows.append(
                                  "| "
                                  + " | ".join(cells)
                                  + " |"
                              )

                      if rows:
                          if len(rows) >= 2:
                              first_row = child.find(
                                  "tr"
                              )

                              count = len(
                                  first_row.find_all(
                                      ["th", "td"],
                                      recursive=False
                                  )
                              )

                              rows.insert(
                                  1,
                                  "| "
                                  + " | ".join(
                                      ["---"] * count
                                  )
                                  + " |"
                              )

                          result.extend(
                              text_component(
                                  "\n".join(rows)
                              )
                          )

                      continue

                  if name in (
                      "section",
                      "article",
                      "main"
                  ):
                      result.extend(
                          render_blocks(
                              child,
                              base_url
                          )
                      )

                      continue

