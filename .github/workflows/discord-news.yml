name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state-v3
          key: discord-news-v3-${{ github.run_id }}
          restore-keys: |
            discord-news-v3-

      - name: Install parser
        run: |
          python3 -m pip install --disable-pip-version-check --quiet beautifulsoup4

      - name: Fetch and send updates
        env:
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
        run: |
          set -euo pipefail

          cat > /tmp/discord_news.py <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from datetime import datetime
          from bs4 import BeautifulSoup, NavigableString, Tag

          STATE = Path(".discord-state-v3")
          STATE.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 DiscordDocsNews/8.0",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          MAX_TEXT = 3900
          MAX_CONTAINER_BYTES = 8500
          MAX_CONTAINER_CHILDREN = 9

          DATE_RE = re.compile(
              r"^(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+\d{4}$",
              re.I
          )

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise RuntimeError(
                      "HTTP {} while fetching {}: {}".format(
                          e.code, url, body[:1000]
                      )
                  )

          def absolute_url(base, value):
              if not value:
                  return ""
              return urllib.parse.urljoin(base, value.strip())

          def clean_text(value):
              value = re.sub(r"\s+", " ", value or "")
              return value.strip()

          def inline_markdown(node, base_url):
              if isinstance(node, NavigableString):
                  return str(node).replace("\xa0", " ")

              if not isinstance(node, Tag):
                  return ""

              name = node.name.lower()

              if name in ("script", "style", "noscript", "svg"):
                  return ""

              if name == "br":
                  return "\n"

              if name == "a":
                  text = "".join(
                      inline_markdown(child, base_url)
                      for child in node.children
                  ).strip()
                  href = absolute_url(base_url, node.get("href", ""))
                  if href and text:
                      return "[{}]({})".format(text, href)
                  return text

              if name in ("strong", "b"):
                  text = "".join(
                      inline_markdown(child, base_url)
                      for child in node.children
                  ).strip()
                  return "**{}**".format(text) if text else ""

              if name in ("em", "i"):
                  text = "".join(
                      inline_markdown(child, base_url)
                      for child in node.children
                  ).strip()
                  return "*{}*".format(text) if text else ""

              if name == "del":
                  text = "".join(
                      inline_markdown(child, base_url)
                      for child in node.children
                  ).strip()
                  return "~~{}~~".format(text) if text else ""

              if name == "code":
                  text = node.get_text(" ", strip=True)
                  return "`{}`".format(text) if text else ""

              if name == "img":
                  return ""

              result = "".join(
                  inline_markdown(child, base_url)
                  for child in node.children
              )

              result = re.sub(r"[ \t]+", " ", result)
              result = re.sub(r" *\n *", "\n", result)

              return result

          def split_text(text, limit=MAX_TEXT):
              text = text.strip()

              if not text:
                  return []

              if len(text) <= limit:
                  return [text]

              pieces = []
              remaining = text

              while len(remaining) > limit:
                  cut = remaining.rfind("\n\n", 0, limit)

                  if cut < 1000:
                      cut = remaining.rfind("\n", 0, limit)

                  if cut < 1000:
                      cut = remaining.rfind(" ", 0, limit)

                  if cut < 500:
                      cut = limit

                  pieces.append(remaining[:cut].strip())
                  remaining = remaining[cut:].strip()

              if remaining:
                  pieces.append(remaining)

              return pieces

          def text_component(text):
              components = []

              for piece in split_text(text):
                  if piece.strip():
                      components.append({
                          "type": 10,
                          "content": piece.strip()
                      })

              return components

          def separator():
              return {
                  "type": 14,
                  "spacing": 1
              }

          def media_component(urls):
              urls = [u for u in urls if u]

              if not urls:
                  return None

              items = []

              for url in urls[:10]:
                  items.append({
                      "type": 1,
                      "media": {
                          "url": url
                      }
                  })

              return {
                  "type": 12,
                  "items": items
              }

          def render_list(tag, base_url):
              ordered = tag.name.lower() == "ol"
              lines = []
              number = 1

              for li in tag.find_all("li", recursive=False):
                  text = inline_markdown(li, base_url)
                  text = re.sub(r"\s+", " ", text).strip()

                  if not text:
                      continue

                  prefix = "{}. ".format(number) if ordered else "- "
                  lines.append(prefix + text)
                  number += 1

              return "\n".join(lines)

          def render_blocks(parent, base_url):
              output = []

              for child in parent.children:
                  if isinstance(child, NavigableString):
                      text = clean_text(str(child))
                      if text:
                          output.extend(text_component(text))
                      continue

                  if not isinstance(child, Tag):
                      continue

                  name = child.name.lower()

                  if name in (
                      "script",
                      "style",
                      "noscript",
                      "nav",
                      "header",
                      "footer",
                      "aside",
                      "svg"
                  ):
                      continue

                  if name in ("h1", "h2", "h3", "h4", "h5", "h6"):
                      text = inline_markdown(child, base_url).strip()

                      if text:
                          level = int(name[1])

                          if level <= 2:
                              text = "# " + text
                          elif level == 3:
                              text = "## " + text
                          else:
                              text = "### " + text

                          output.extend(text_component(text))
                          output.append(separator())

                      continue

                  if name == "p":
                      images = []

                      for img in child.find_all("img"):
                          src = (
                              img.get("src")
                              or img.get("data-src")
                              or img.get("data-lazy-src")
                          )

                          if not src and img.get("srcset"):
                              src = img.get("srcset").split(",")[0].strip().split(" ")[0]

                          if src:
                              images.append(absolute_url(base_url, src))

                      if images:
                          media = media_component(images)
                          if media:
                              output.append(media)

                      text = inline_markdown(child, base_url)
                      text = re.sub(r"[ \t]+", " ", text)
                      text = re.sub(r"\n{3,}", "\n\n", text).strip()

                      if text:
                          output.extend(text_component(text))

                      continue

                  if name in ("ul", "ol"):
                      text = render_list(child, base_url)

                      if text:
                          output.extend(text_component(text))

                      continue

                  if name == "blockquote":
                      text = inline_markdown(child, base_url).strip()

                      if text:
                          lines = text.splitlines()
                          text = "\n".join(
                              "> " + line.strip()
                              for line in lines
                              if line.strip()
                          )
                          output.extend(text_component(text))

                      continue

                  if name == "pre":
                      code = child.get_text("\n", strip=False).strip()

                      if code:
                          language = ""

                          code_node = child.find("code")

                          if code_node:
                              classes = code_node.get("class", [])

                              for cls in classes:
                                  if cls.startswith("language-"):
                                      language = cls[9:]
                                      break

                          fenced = "```{}\n{}\n```".format(
                              language,
                              code
                          )

                          output.extend(text_component(fenced))

                      continue

                  if name == "hr":
                      output.append(separator())
                      continue

                  if name == "img":
                      src = (
                          child.get("src")
                          or child.get("data-src")
                          or child.get("data-lazy-src")
                      )

                      if not src and child.get("srcset"):
                          src = child.get("srcset").split(",")[0].strip().split(" ")[0]

                      if src:
                          media = media_component(
                              [absolute_url(base_url, src)]
                          )

                          if media:
                              output.append(media)

                      continue

                  if name == "figure":
                      images = []

                      for img in child.find_all("img"):
                          src = (
                              img.get("src")
                              or img.get("data-src")
                              or img.get("data-lazy-src")
                          )

                          if not src and img.get("srcset"):
                              src = img.get("srcset").split(",")[0].strip().split(" ")[0]

                          if src:
                              images.append(absolute_url(base_url, src))

                      if images:
                          media = media_component(images)

                          if media:
                              output.append(media)

                      caption = child.find("figcaption")

                      if caption:
                          text = inline_markdown(caption, base_url).strip()

                          if text:
                              output.extend(text_component("*{}*".format(text)))

                      continue

                  if name == "table":
                      rows = []

                      for tr in child.find_all("tr"):
                          cells = []

                          for cell in tr.find_all(["th", "td"], recursive=False):
                              value = inline_markdown(
                                  cell,
                                  base_url
                              ).strip()

                              value = value.replace("|", "\\|")
                              cells.append(value)

                          if cells:
                              rows.append("| " + " | ".join(cells) + " |")

                      if rows:
                          if len(rows) >= 2:
                              count = len(
                                  child.find("tr").find_all(
                                      ["th", "td"],
                                      recursive=False
                                  )
                              )

                              rows.insert(
                                  1,
                                  "| " + " | ".join(
                                      ["---"] * count
                                  ) + " |"
                              )

                          output.extend(
                              text_component("\n".join(rows))
                          )

                      continue

                  if name in (
                      "div",
                      "section",
                      "article",
                      "main",
                      "details",
                      "summary"
                  ):
                      output.extend(
                          render_blocks(child, base_url)
                      )
                      continue

                  text = inline_markdown(child, base_url)
                  text = re.sub(r"\s+", " ", text).strip()

                  if text:
                      output.extend(text_component(text))

              return compact_components(output)

          def compact_components(components):
              result = []

              for component in components:
                  if not component:
                      continue

                  if component.get("type") == 10:
                      content = component.get("content", "").strip()

                      if not content:
                          continue

                      if result and result[-1].get("type") == 10:
                          previous = result[-1].get("content", "")

                          if len(previous) + len(content) + 2 <= MAX_TEXT:
                              result[-1]["content"] = (
                                  previous + "\n\n" + content
                              )
                              continue

                      component["content"] = content

                  result.append(component)

              return result

          def article_root(soup):
              root = soup.find("article")

              if root:
                  return root

              root = soup.find("main")

              if root:
                  return root

              return soup.body or soup

          def get_meta(soup, key):
              tag = soup.find(
                  "meta",
                  attrs={"property": key}
              )

              if not tag:
                  tag = soup.find(
                      "meta",
                      attrs={"name": key}
                  )

              if not tag:
                  return ""

              return (
                  tag.get("content", "")
                  or ""
              ).strip()

          def get_article(url):
              html = fetch(url)
              soup = BeautifulSoup(html, "html.parser")

              for tag in soup.find_all(
                  ["script", "style", "noscript", "nav", "header", "footer"]
              ):
                  tag.decompose()

              title = get_meta(soup, "og:title")

              if not title:
                  h1 = soup.find("h1")

                  if h1:
                      title = clean_text(h1.get_text(" ", strip=True))

              if not title:
                  title = "Discord Update"

              published = get_meta(
                  soup,
                  "article:published_time"
              )

              if not published:
                  published = get_meta(
                      soup,
                      "date"
                  )

              if published:
                  match = re.search(
                      r"\d{4}-\d{2}-\d{2}",
                      published
                  )

                  if match:
                      published = match.group(0)

              root = article_root(soup)

              components = render_blocks(
                  root,
                  url
              )

              og_image = get_meta(
                  soup,
                  "og:image"
              )

              if og_image:
                  og_image = absolute_url(
                      url,
                      og_image
                  )

              if og_image:
                  first_media = next(
                      (
                          c for c in components
                          if c.get("type") == 12
                      ),
                      None
                  )

                  if not first_media:
                      components.insert(
                          0,
                          media_component([og_image])
                      )

              if not components:
                  text = root.get_text(
                      "\n",
                      strip=True
                  )

                  if text:
                      components = text_component(text)

              title_text = "# " + title

              has_title = any(
                  c.get("type") == 10
                  and c.get("content", "").strip() == title_text
                  for c in components
              )

              if not has_title:
                  components.insert(
                      0,
                      {
                          "type": 10,
                          "content": title_text
                      }
                  )

              if published:
                  components.insert(
                      1,
                      {
                          "type": 10,
                          "content": "**Published:** " + published
                      }
                  )

              return {
 
