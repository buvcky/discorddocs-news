name: Discord Official News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  discord-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover official updates
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import re
          import html
          import hashlib
          import os
          import urllib.request
          from urllib.parse import urljoin

          UA = "DiscordDocsNews/1.0"

          def get(url, github=False):
              headers = {"User-Agent": UA}
              if github:
                  headers["Accept"] = "application/vnd.github+json"
                  headers["Authorization"] = f"Bearer {os.environ['GITHUB_TOKEN']}"
                  headers["X-GitHub-Api-Version"] = "2026-03-10"

              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          def clean(s):
              s = html.unescape(s or "")
              s = re.sub(r"<[^>]+>", " ", s)
              s = re.sub(r"\s+", " ", s)
              return s.strip()

          def meta(page, name):
              patterns = [
                  rf'<meta[^>]+property=["\']{re.escape(name)}["\'][^>]+content=["\'](.*?)["\']',
                  rf'<meta[^>]+content=["\'](.*?)["\'][^>]+property=["\']{re.escape(name)}["\']'
              ]

              for p in patterns:
                  m = re.search(p, page, re.I | re.S)
                  if m:
                      return clean(m.group(1))

              return ""

          def details(url):
              try:
                  page = get(url)

                  return {
                      "title": (
                          meta(page, "og:title")
                          or meta(page, "twitter:title")
                          or "Official Discord Update"
                      ),
                      "description": (
                          meta(page, "og:description")
                          or meta(page, "twitter:description")
                          or meta(page, "description")
                          or "An official update was published by Discord."
                      ),
                      "image": (
                          meta(page, "og:image")
                          or meta(page, "twitter:image")
                      )
                  }

              except Exception:
                  return {
                      "title": "Official Discord Update",
                      "description": "An official update was published by Discord.",
                      "image": ""
                  }

          def find_link(page, pattern):
              matches = []

              for m in re.finditer(
                  rf'href=["\'](https://discord\.com{pattern})["\']',
                  page,
                  re.I
              ):
                  matches.append(m.group(1))

              for m in re.finditer(
                  rf'href=["\']({pattern})["\']',
                  page,
                  re.I
              ):
                  matches.append(urljoin("https://discord.com", m.group(1)))

              seen = set()

              for url in matches:
                  url = html.unescape(url)
                  url = url.split("?")[0].rstrip("/")

                  if url not in seen:
                      seen.add(url)
                      return url

              return ""

          def make_item(url, source, item_type):
              d = details(url)

              return {
                  "found": True,
                  "id": hashlib.sha256(url.encode()).hexdigest()[:32],
                  "url": url,
                  "title": d["title"][:250],
                  "description": d["description"][:1800],
                  "image": d["image"],
                  "source": source,
                  "type": item_type
              }

          sources = {}

          # --------------------------------------------------
          # Discord Changelog
          # --------------------------------------------------
          try:
              page = get("https://discord.com/blog")

              url = find_link(
                  page,
                  r"/blog/discord-update-[^\"'#?]+"
              )

              if url:
                  sources["changelog"] = make_item(
                      url,
                      "Discord Blog",
                      "Changelog"
                  )

          except Exception as e:
              print("Changelog error:", e)

          # --------------------------------------------------
          # Discord Patch Notes
          # --------------------------------------------------
          try:
              page = get("https://discord.com/tags/patch-notes")

              url = find_link(
                  page,
                  r"/blog/discord-patch-notes-[^\"'#?]+"
              )

              if url:
                  sources["patch_notes"] = make_item(
                      url,
                      "Discord Patch Notes",
                      "Patch Notes"
                  )

          except Exception as e:
              print("Patch Notes error:", e)

          # --------------------------------------------------
          # Developer Newsletter
          # --------------------------------------------------
          try:
              page = get(
                  "https://discord.com/developers/developer-newsletter"
              )

              url = find_link(
                  page,
                  r"/developer-newsletter/[^\"'#?]+"
              )

              if url:
                  sources["developer_news"] = make_item(
                      url,
                      "Discord Developer Newsletter",
                      "Developer News"
                  )

          except Exception as e:
              print("Developer News error:", e)

          # --------------------------------------------------
          # Official Discord GitHub repository
          # --------------------------------------------------
          try:
              repo = "discord/discord-api-docs"

              commits = json.loads(
                  get(
                      f"https://api.github.com/repos/{repo}/commits?per_page=1",
                      github=True
                  )
              )

              latest = commits[0]
              commit_sha = latest["sha"]

              commit = json.loads(
                  get(
                      f"https://api.github.com/repos/{repo}/commits/{commit_sha}",
                      github=True
                  )
              )

              message = commit["commit"]["message"].strip()
              title = message.splitlines()[0][:250]

              author = (
                  commit.get("author", {}).get("login")
                  or commit["commit"].get("author", {}).get("name")
                  or "Unknown"
              )

              files = [
                  f["filename"]
                  for f in commit.get("files", [])
                  if f.get("filename")
              ]

              combined = (
                  message + "\n" + "\n".join(files)
              ).lower()

              # Breaking Changes have highest priority.
              if any(
                  x in combined
                  for x in [
                      "breaking change",
                      "breaking-change",
                      "breaking:",
                      "deprecated",
                      "deprecation",
                      "deprecate",
                      "removed",
                      "removal",
                      "remove endpoint"
                  ]
              ):
                  category = "breaking"
                  category_name = "Breaking Changes"

              elif any(
                  f.startswith("resources/discord-social-sdk/")
                  or f.startswith("developers/discord-social-sdk/")
                  for f in files
              ):
                  category = "social_sdk"
                  category_name = "Social SDK"

              elif any(
                  f == "developers/reference.mdx"
                  or f.startswith("developers/reference/")
                  or f.startswith("developers/resources/")
                  or f.startswith("developers/events/")
                  or f.startswith("developers/topics/")
                  or f.startswith("developers/components/")
                  or f == "developers/change-log.mdx"
                  for f in files
              ):
                  category = "api"
                  category_name = "API Updates"

              else:
                  category = "docs"
                  category_name = "Docs Updates"

              file_list = "\n".join(files[:10])

              if len(files) > 10:
                  file_list += f"\n+ {len(files) - 10} more"

              sources[category] = {
                  "found": True,
                  "id": commit_sha,
                  "url": commit["html_url"],
                  "title": title or "Discord Developer Documentation Update",
                  "description": (
                      "An official update was published in "
                      "the Discord Developer Documentation."
                  ),
                  "image": "",
                  "source": "Discord Developer Documentation",
                  "type": category_name,
                  "author": author,
                  "commit": commit_sha[:12],
                  "files": file_list
              }

          except Exception as e:
              print("GitHub error:", e)

          with open("sources.json", "w", encoding="utf-8") as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(
              sources,
              ensure_ascii=False,
              indent=2
          ))
          PY

      - name: Create Components V2 sender
        run: |
          cat > send.py <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          category = sys.argv[1]
          webhook = os.environ["WEBHOOK_URL"]

          with open("sources.json", "r", encoding="utf-8") as f:
              sources = json.load(f)

          item = sources.get(category)

          if not item or not item.get("found"):
              print(f"No update for {category}")
              sys.exit(0)

          title = item.get(
              "title",
              "Official Discord Update"
          )

          description = item.get(
              "description",
              "An official update was published by Discord."
          )

          source = item.get(
              "source",
              "Discord"
          )

          item_type = item.get(
              "type",
              category
          )

          url = item.get("url", "")
          image = item.get("image", "")

          text = (
              f"**Source**\n"
              f"{source}\n\n"
              f"**Type**\n"
              f"{item_type}"
          )

          if item.get("author"):
              text += (
                  f"\n\n**Author**\n"
                  f"{item['author']}"
              )

          if item.get("commit"):
              text += (
                  f"\n\n**Commit**\n"
                  f"`{item['commit']}`"
              )

          if item.get("files"):
              text += (
                  f"\n\n**Changed Files**\n"
                  f"```text\n{item['files'][:900]}\n```"
              )

          inner = [
              {
                  "type": 10,
                  "content": (
                      f"# {title}\n\n"
                      f"{description[:1800]}"
                  )
              },
              {
                  "type": 14,
                  "divider": True,
                  "spacing": 1
              },
              {
                  "type": 10,
                  "content": text[:1900]
              }
          ]

          if image:
              inner.append(
                  {
                      "type": 12,
                      "items": [
                          {
                              "media": {
                                  "url": image
                              }
                          }
                      ]
                  }
              )

          inner.extend([
              {
                  "type": 14,
                  "divider": True,
                  "spacing": 1
              },
              {
                  "type": 1,
                  "components": [
                      {
                          "type": 2,
                          "style": 5,
                          "label": "Open Official Update",
                          "url": url
                      }
                  ]
              }
          ])

          usernames = {
              "changelog": "Changelog Updates",
              "patch_notes": "Patch Notes",
              "developer_news": "Developer News",
              "api": "API Updates",
              "docs": "Docs Updates",
              "social_sdk": "Social SDK",
              "breaking": "Breaking Changes"
          }

          payload = {
              "username": usernames.get(
                  category,
                  "Docs Updates"
              ),

              # IS_COMPONENTS_V2
              "flags": 32768,

              "components": [
                  {
                      "type": 17,
                      "accent_color": 5793266,
                      "components": inner
                  }
              ]
          }

          separator = "&" if "?" in webhook else "?"

          url = (
              webhook
              + separator
              + "with_components=true"
              + "&wait=true"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordDocsNews/1.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      f"{category}: HTTP {response.status}"
                  )

          except urllib.error.HTTPError as e:
              body = e.read().decode(
                  "utf-8",
                  "ignore"
              )

              print(
                  f"{category}: HTTP {e.code}"
              )

              print(body)

              sys.exit(1)
          PY

      # ============================================================
      # CHANGELOG
      # ============================================================
      - name: Send Changelog
        if: ${{ hashFiles('sources.json') != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_CHANGELOG }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import os

          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)

          item = data.get("changelog")

          if item and item.get("found"):
              state = ".state-changelog"

              old = ""
              if os.path.exists(state):
                  old = open(state).read().strip()

              current = item["id"]

              if current != old:
                  subprocess.run(
                      ["python3", "send.py", "changelog"],
                      check=True
                  )

                  open(state, "w").write(current)
          PY

      # ============================================================
      # PATCH NOTES
      # ============================================================
      - name: Send Patch Notes
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_PATCH_NOTES }}
        run: |
          python3 - <<'PY'
