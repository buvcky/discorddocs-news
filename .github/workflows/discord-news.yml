                  old = open(state).read().strip()

              current = item["id"]

              if current != old:
                  subprocess.run(
                      ["python3", "send.py", "patch_notes"],
                      check=True
                  )

                  open(state, "w").write(current)
          PY

      # ============================================================
      # DEVELOPER NEWS
      # ============================================================
      - name: Send Developer News
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import os

          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)

          item = data.get("developer_news")

          if item and item.get("found"):
              state = ".state-developer-news"

              old = ""
              if os.path.exists(state):
                  old = open(state).read().strip()

              current = item["id"]

              if current != old:
                  subprocess.run(
                      ["python3", "send.py", "developer_news"],
                      check=True
                  )

                  open(state, "w").write(current)
          PY

      # ============================================================
      # API
      # ============================================================
      - name: Send API Update
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_API }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import os

          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)

          item = data.get("api")

          if item and item.get("found"):
              state = ".state-api"

              old = ""
              if os.path.exists(state):
                  old = open(state).read().strip()

              current = item["id"]

              if current != old:
                  subprocess.run(
                      ["python3", "send.py", "api"],
                      check=True
                  )

                  open(state, "w").write(current)
          PY

      # ============================================================
      # DOCS
      # ============================================================
      - name: Send Docs Update
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_DOCS }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import os

          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)

          item = data.get("docs")

          if item and item.get("found"):
              state = ".state-docs"

              old = ""
              if os.path.exists(state):
                  old = open(state).read().strip()

              current = item["id"]

              if current != old:
                  subprocess.run(
