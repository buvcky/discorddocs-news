name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-state-${{ github.run_id }}
          restore-keys: |
            discord-news-state-

      - name: Fetch official Discord updates
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from html import unescape

          STATE = Path(".discord-state")
          STATE.mkdir(exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (DiscordDocsNews/3.0)",
              "Accept": "text/html,application/xhtml+xml,*/*",
          }


          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=45
                  ) as response:
                      return response.read().decode(
                          "utf-8",
                          "replace"
                      )

              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8",
                      "replace"
                  )

                  raise RuntimeError(
                      f"HTTP {error.code} fetching {url}: "
                      f"{body[:500]}"
                  )


          def clean(value):
              value = unescape(value or "")

              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<svg\b[^>]*>.*?</svg>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def get_links(html, base_url):
              results = []

              pattern = re.compile(
                  r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>'
                  r'(.*?)'
                  r'</a>',
                  re.I | re.S
              )

              for href, content in pattern.findall(html):
                  title = clean(content)

                  if not title:
                      continue

                  url = urllib.parse.urljoin(
                      base_url,
                      unescape(href)
                  )

                  if not url.startswith(
                      "https://discord.com/"
                  ):
                      continue

                  results.append(
                      (url, title)
                  )

              return results


          def get_meta(html, name):
              patterns = [
                  rf'<meta\b[^>]*(?:property|name)=["\']{re.escape(name)}["\'][^>]*content=["\']([^"\']+)["\']',
                  rf'<meta\b[^>]*content=["\']([^"\']+)["\'][^>]*(?:property|name)=["\']{re.escape(name)}["\']',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      html,
                      flags=re.I
                  )

                  if match:
                      return unescape(
                          match.group(1)
                      ).strip()

              return ""


          def extract_article(url):
              html = fetch(url)

              title = get_meta(
                  html,
                  "og:title"
              )

              if not title:
                  match = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      html,
                      flags=re.I | re.S
                  )

                  if match:
                      title = clean(
                          match.group(1)
                      )

              if not title:
                  title = "Discord Update"

              date = get_meta(
                  html,
                  "article:published_time"
              )

              if date:
                  date = date[:10]

              if not date:
                  match = re.search(
                      r"\b(?:January|February|March|April|May|June|"
                      r"July|August|September|October|November|December)"
                      r"\s+\d{1,2},\s+20\d{2}\b",
                      html,
                      flags=re.I
                  )

                  if match:
                      date = match.group(0)

              article_match = re.search(
                  r"<article\b[^>]*>(.*?)</article>",
                  html,
                  flags=re.I | re.S
              )

              if not article_match:
                  article_match = re.search(
                      r"<main\b[^>]*>(.*?)</main>",
                      html,
                      flags=re.I | re.S
                  )

              if article_match:
                  body = article_match.group(1)
              else:
                  body = html

              body = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<(nav|header|footer)\b[^>]*>.*?</\1>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"</(h[1-6]|p|li|blockquote|pre|div|section)>",
                  "\n\n",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<li\b[^>]*>",
                  "- ",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<[^>]+>",
                  " ",
                  body
              )

              body = unescape(body)

              lines = []

              for line in body.splitlines():
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  ).strip()

                  if not line:
                      continue

                  if lines and line == lines[-1]:
                      continue

                  lines.append(line)

              content = "\n\n".join(
                  lines
              ).strip()

              if title:
                  content = re.sub(
                      r"^" + re.escape(title) + r"\s*",
                      "",
                      content,
                      count=1,
                      flags=re.I
                  ).strip()

              images = []

              for image in [
                  get_meta(html, "og:image"),
                  get_meta(html, "twitter:image"),
              ]:
                  if not image:
                      continue

                  image = urllib.parse.urljoin(
                      url,
                      image
                  )

                  if image not in images:
                      images.append(image)

              return {
                  "title": title,
                  "date": date,
                  "url": url,
                  "content": content,
                  "images": images[:3],
              }


          def latest_from_tag(tag_url, phrase):
              html = fetch(tag_url)

              candidates = []

              for url, title in get_links(
                  html,
                  tag_url
              ):
                  if "/blog/" not in url:
                      continue

                  if phrase.lower() not in title.lower():
                      continue

                  candidates.append(
                      (url, title)
                  )

              if not candidates:
                  raise RuntimeError(
                      f"No '{phrase}' article found at {tag_url}"
                  )

              return extract_article(
                  candidates[0][0]
              )


          def latest_newsletter():
              url = (
                  "https://discord.com/"
                  "developers/developer-newsletter"
              )

              html = fetch(url)

              for article_url, title in get_links(
                  html,
                  url
              ):
                  if "/developer-newsletter/" not in article_url:
                      continue

                  return extract_article(
                      article_url
                  )

              raise RuntimeError(
                  "No developer newsletter found"
              )


          def developer_changelog():
              url = (
                  "https://discord.com/"
                  "developers/docs/change-log"
              )

              html = fetch(url)

              title = "Discord Developer Changelog"

              body_match = re.search(
                  r"<main\b[^>]*>(.*?)</main>",
                  html,
                  flags=re.I | re.S
              )

              if body_match:
                  body = body_match.group(1)
              else:
                  body = html

              body = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  body,
                  flags=re.I | re.S
              )

              body = re.sub(
                  r"</(h[1-6]|p|li|blockquote|pre|div|section|article)>",
                  "\n\n",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<li\b[^>]*>",
                  "- ",
                  body,
                  flags=re.I
              )

              body = re.sub(
                  r"<[^>]+>",
                  " ",
                  body
              )

              body = unescape(body)

              lines = []

              for line in body.splitlines():
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  ).strip()

                  if line:
                      lines.append(line)

              content = "\n\n".join(
                  lines
              ).strip()

              return {
                  "title": title,
                  "date": "",
                  "url": url,
                  "content": content,
                  "images": [],
              }


          def find_section(item, keywords):
              content = item["content"]

              lower = content.lower()

              positions = []

              for keyword in keywords:
                  position = lower.find(
                      keyword.lower()
                  )

                  if position >= 0:
                      positions.append(
                          position
                      )

              if not positions:
                  return None

              position = min(positions)

              start = max(
                  0,
                  position - 700
              )

              end = min(
                  len(content),
                  position + 3600
              )

              section = content[start:end].strip()

              return {
                  "title": item["title"],
                  "date": item["date"],
                  "url": item["url"],
                  "content": section,
                  "images": item["images"],
              }


          def split_content(content, limit=3600):
              paragraphs = content.split(
                  "\n\n"
              )

              chunks = []
              current = ""

              for paragraph in paragraphs:
                  paragraph = paragraph.strip()

                  if not paragraph:
                      continue

                  candidate = (
                      paragraph
                      if not current
                      else current + "\n\n" + paragraph
                  )

                  if len(candidate) <= limit:
                      current = candidate
                      continue

                  if current:
                      chunks.append(
                          current
                      )

                  while len(paragraph) > limit:
                      cut = paragraph.rfind(
                          " ",
                          0,
                          limit
                      )

                      if cut < 500:
                          cut = limit

                      chunks.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = paragraph[
                          cut:
                      ].strip()

                  current = paragraph

              if current:
                  chunks.append(
                      current
                  )

              return chunks or [""]


          def get_state(category):
              path = STATE / (
                  f"{category}.state"
              )

              if not path.exists():
                  return ""

              return path.read_text(
                  encoding="utf-8"
              ).strip()


          def save_state(category, value):
              path = STATE / (
                  f"{category}.state"
              )

              path.write_text(
                  value,
                  encoding="utf-8"
              )


          def send(category, item, webhook_name):
              webhook = os.environ.get(
                  webhook_name,
                  ""
              ).strip()

              if not webhook:
                  raise RuntimeError(
                      f"{webhook_name} is empty"
                  )

              identity = (
                  item["url"]
                  + "|"
                  + item["title"]
                  + "|"
                  + item["date"]
                  + "|"
                  + item["content"]
              )

              update_id = hashlib.sha256(
                  identity.encode("utf-8")
              ).hexdigest()

              if get_state(category) == update_id:
                  print(
                      f"{category}: already sent"
                  )
                  return

              chunks = split_content(
                  item["content"]
              )

              print(
                  f"{category}: "
                  f"{len(chunks)} message(s)"
              )

              for index, chunk in enumerate(
                  chunks
              ):
                  components = []

                  if index == 0:
                      for image in item["images"][:1]:
                          components.append({
                              "type": 12,
                              "items": [
                                  {
                                      "type": 1,
                                      "media": {
                                          "url": image
                                      }
                                  }
                              ]
                          })

                  components.append({
                      "type": 10,
                      "content": (
                          f"# {item['title']}"
                      )
                  })

                  if item["date"]:
                      components.append({
                          "type": 10,
                          "content": (
                              f"**Published:** "
                              f"{item['date']}"
                          )
                      })

                  components.append({
                      "type": 14,
                      "spacing": 1
                  })

                  components.append({
                      "type": 10,
                      "content": chunk
                  })

                  components.append({
                      "type": 14,
                      "spacing": 1
                  })

                  components.append({
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": (
                                  "View Source"
                              ),
                              "url": item["url"]
                          }
                      ]
                  })

                  payload = {
                      "flags": 32768,
                      "components": [
                          {
                              "type": 17,
                              "components": components
                          }
                      ]
                  }

                  data = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

                  request = urllib.request.Request(
                      webhook
                      + "?with_components=true&wait=true",
                      data=data,
                      headers={
                          "Content-Type":
                              "application/json",
                          "User-Agent":
                              "DiscordDocsNews/3.0",
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:
                          response.read()

                          print(
                              f"{category}: "
                              f"HTTP {response.status} "
                              f"part "
                              f"{index + 1}/"
                              f"{len(chunks)}"
                          )

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          "replace"
                      )

                      raise RuntimeError(
                          f"{category}: Discord HTTP "
       
