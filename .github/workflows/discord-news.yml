name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-${{ github.run_id }}
          restore-keys: |
            discord-news-

      - name: Fetch official Discord updates and send
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from html import unescape
          from html.parser import HTMLParser

          STATE_DIR = Path(".discord-state")
          STATE_DIR.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (DiscordDocsNews/3.0)",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          BLOG_TAGS = {
              "patch_notes": (
                  "WEBHOOK_PATCH_NOTES",
                  "https://discord.com/tags/patch-notes",
                  "patch notes",
              ),
              "changelog": (
                  "WEBHOOK_CHANGELOG",
                  "https://discord.com/tags/changelog",
                  "changelog",
              ),
          }

          NEWSLETTER_URL = "https://discord.com/developers/developer-newsletter"
          DEVELOPER_CHANGELOG_URL = "https://docs.discord.com/developers/change-log"


          def fetch(url):
              request = urllib.request.Request(url, headers=HEADERS)

              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP {error.code} while fetching {url}: {body[:500]}"
                  )


          def clean(value):
              value = unescape(value or "")
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.href = None
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      data = dict(attrs)
                      self.href = data.get("href")
                      self.text = []

              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.href is not None:
                      title = clean(" ".join(self.text))

                      if self.href and title:
                          self.links.append((self.href, title))

                      self.href = None
                      self.text = []


          def get_links(html, base_url):
              parser = LinkParser()
              parser.feed(html)

              result = []

              for href, title in parser.links:
                  url = urllib.parse.urljoin(base_url, href)
                  result.append((url, title))

              return result


          class ArticleParser(HTMLParser):
              BLOCKS = {
                  "p",
                  "h1",
                  "h2",
                  "h3",
                  "h4",
                  "h5",
                  "h6",
                  "li",
                  "blockquote",
              }

              def __init__(self):
                  super().__init__()

                  self.article_depth = 0
                  self.main_depth = 0
                  self.skip_depth = 0

                  self.current_tag = None
                  self.current_text = []
                  self.blocks = []

                  self.images = []

              def inside_content(self):
                  return self.article_depth > 0 or self.main_depth > 0

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  data = dict(attrs)

                  if tag in ("script", "style", "noscript"):
                      self.skip_depth += 1
                      return

                  if self.skip_depth:
                      return

                  if tag == "article":
                      self.article_depth += 1

                  elif tag == "main":
                      self.main_depth += 1

                  elif tag == "img" and self.inside_content():
                      src = (
                          data.get("src")
                          or data.get("data-src")
                          or data.get("data-lazy-src")
                      )

                      if src:
                          self.images.append(src)

                  if tag in self.BLOCKS and self.inside_content():
                      if self.current_tag is None:
                          self.current_tag = tag
                          self.current_text = []

              def handle_data(self, data):
                  if self.skip_depth:
                      return

                  if self.current_tag is not None:
                      self.current_text.append(data)

              def handle_endtag(self, tag):
                  tag = tag.lower()

                  if tag in ("script", "style", "noscript"):
                      self.skip_depth = max(0, self.skip_depth - 1)
                      return

                  if self.skip_depth:
                      return

                  if tag in self.BLOCKS and self.current_tag == tag:
                      text = clean(" ".join(self.current_text))

                      if text:
                          self.blocks.append((tag, text))

                      self.current_tag = None
                      self.current_text = []

                  if tag == "article":
                      self.article_depth = max(0, self.article_depth - 1)

                  elif tag == "main":
                      self.main_depth = max(0, self.main_depth - 1)


          def extract_article(url):
              html = fetch(url)

              parser = ArticleParser()
              parser.feed(html)

              blocks = parser.blocks

              title = ""

              for tag, text in blocks:
                  if tag == "h1":
                      title = text
                      break

              if not title:
                  title = "Discord Update"

              date_match = re.search(
                  r"\b(?:January|February|March|April|May|June|"
                  r"July|August|September|October|November|December)"
                  r"\s+\d{1,2},\s+20\d{2}\b",
                  html,
                  re.I,
              )

              date = date_match.group(0) if date_match else ""

              paragraphs = []
              seen = set()

              for tag, text in blocks:
                  if not text:
                      continue

                  if text == title:
                      continue

                  if date and text == date:
                      continue

                  if text in seen:
                      continue

                  seen.add(text)

                  if tag == "li":
                      paragraphs.append(f"- {text}")
                  elif tag == "blockquote":
                      paragraphs.append(f"> {text}")
                  elif tag.startswith("h"):
                      paragraphs.append(f"## {text}")
                  else:
                      paragraphs.append(text)

              content = "\n\n".join(paragraphs).strip()

              images = []

              for image in parser.images:
                  image = urllib.parse.urljoin(url, image)

                  if not image.startswith("http"):
                      continue

                  if image.startswith("data:"):
                      continue

                  if image.lower().endswith(".svg"):
                      continue

                  if image not in images:
                      images.append(image)

                  if len(images) >= 4:
                      break

              return {
                  "title": title,
                  "date": date,
                  "url": url,
                  "content": content,
                  "images": images,
              }


          def find_blog_update(tag_url, keyword):
              html = fetch(tag_url)
              links = get_links(html, tag_url)

              candidates = []

              for url, title in links:
                  if "/blog/" not in url:
                      continue

                  if keyword.lower() in title.lower():
                      candidates.append((url, title))

              if not candidates:
                  raise RuntimeError(
                      f"No official Discord article found at {tag_url}"
                  )

              return extract_article(candidates[0][0])


          def find_latest_newsletter():
              html = fetch(NEWSLETTER_URL)
              links = get_links(html, NEWSLETTER_URL)

              for url, title in links:
                  if "/developer-newsletter/" in url:
                      return extract_article(url)

              raise RuntimeError(
                  "No official Discord Developer Newsletter article found"
              )


          class TextParser(HTMLParser):
              BLOCKS = {
                  "h1",
                  "h2",
                  "h3",
                  "h4",
                  "h5",
                  "h6",
                  "p",
                  "li",
                  "button",
              }

              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.current = None
                  self.buffer = []
                  self.lines = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()

                  if tag in ("script", "style", "noscript"):
                      self.skip += 1
                      return

                  if self.skip:
                      return

                  if tag in self.BLOCKS:
                      self.current = tag
                      self.buffer = []

              def handle_data(self, data):
                  if self.skip:
                      return

                  if self.current is not None:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  tag = tag.lower()

                  if tag in ("script", "style", "noscript"):
                      self.skip = max(0, self.skip - 1)
                      return

                  if self.skip:
                      return

                  if self.current == tag:
                      text = clean(" ".join(self.buffer))

                      if text:
                          self.lines.append(text)

                      self.current = None
                      self.buffer = []


          def parse_developer_changelog():
              html = fetch(DEVELOPER_CHANGELOG_URL)

              parser = TextParser()
              parser.feed(html)

              lines = []

              for line in parser.lines:
                  if line not in lines:
                      lines.append(line)

              date_pattern = re.compile(
                  r"^(January|February|March|April|May|June|July|"
                  r"August|September|October|November|December)"
                  r"\s+\d{1,2},\s+20\d{2}$",
                  re.I,
              )

              positions = []

              for index, line in enumerate(lines):
                  if date_pattern.match(line):
                      positions.append(index)

              entries = []

              for pos_index, start in enumerate(positions):
                  end = (
                      positions[pos_index + 1]
                      if pos_index + 1 < len(positions)
                      else len(lines)
                  )

                  chunk = lines[start:end]

                  if len(chunk) < 3:
                      continue

                  date = chunk[0]

                  category = ""
                  title = ""
                  body_start = 1

                  for i in range(1, min(len(chunk), 8)):
                      value = chunk[i]

                      if value in {
                          "HTTP API",
                          "HTTP API Breaking Change",
                          "Discord Social SDK",
                          "Discord Social SDK HTTP API",
                          "Gateway",
                          "Gateway Activities",
                          "Interactions",
                          "Components",
                          "Documentation",
                          "Breaking Change",
                      }:
                          category = value
                          body_start = i + 1
                          break

                  if body_start < len(chunk):
                      title = chunk[body_start]
                      body_start += 1

                  body = "\n\n".join(
                      chunk[body_start:]
                  ).strip()

                  if not title:
                      continue

                  entries.append({
                      "date": date,
                      "category": category,
                      "title": title,
                      "content": body,
                  })

              return entries


          def find_developer_update(entries, kind):
              for entry in entries:
                  category = entry["category"].lower()
                  title = entry["title"].lower()
                  content = entry["content"].lower()

                  if kind == "breaking":
                      if (
                          "breaking change" in category
                          or "breaking change" in title
                      ):
                          return entry

                  elif kind == "api":
                      if (
                          "http api" in category
                          and "breaking change" not in category
                      ):
                          return entry

                  elif kind == "social_sdk":
                      if "social sdk" in category:
                          return entry

                  elif kind == "docs":
                      if (
                          "documentation" in category
                          or "documentation" in title
                          or "developer resources" in content
                      ):
                          return entry

              return None


          def make_item(entry):
              return {
                  "title": entry["title"],
                  "date": entry["date"],
                  "url": DEVELOPER_CHANGELOG_URL,
                  "content": entry["content"],
                  "images": [],
              }


          def make_id(item):
              raw = (
                  item["url"]
                  + "|"
                  + item["title"]
                  + "|"
                  + item.get("date", "")
                  + "|"
                  + item.get("content", "")
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          def state_path(category):
              return STATE_DIR / f"{category}.state"


          def get_state(category):
              path = state_path(category)

              if not path.exists():
                  return ""

              return path.read_text(
                  encoding="utf-8"
              ).strip()


          def set_state(category, value):
              state_path(category).write_text(
                  value,
                  encoding="utf-8"
              )


          def split_text(text, limit=3500):
              if not text:
                  return [""]

              paragraphs = text.split("\n\n")

              chunks = []
              current = ""

              for paragraph in paragraphs:
                  paragraph = paragraph.strip()

                  if not paragraph:
                      continue

                  candidate = (
                      paragraph
                      if not current
                      else current + "\n\n" + paragraph
                  )

                  if len(candidate) <= limit:
                      current = candidate
                      continue

                  if current:
                      chunks.append(current)

                  while len(paragraph) > limit:
                      cut = paragraph.rfind(" ", 0, limit)

                      if cut < 500:
                          cut = limit

                      chunks.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = paragraph[cut:].strip()

                  current = paragraph

              if current:
                  chunks.append(current)

              return chunks or [""]


          def build_payload(item, text, index, total):
              components = []

              if index == 0:
                  for image in item.get("images", []):
                      components.append({
                          "type": 12,
                          "items": [
                              {
                                  "type": 1,
                                  "media": {
                                      "url": image
                                  }
                              }
                          ]
                      })

              title = item["title"]

              if total > 1:
                  title = (
                      f"{title}\n"
                      f"Part {index + 1}/{total}"
                  )

              components.append({
                  "type": 10,
                  "content": f"# {title}",
              })

              if item.get("date"):
                  components.append({
                      "type": 10,
                      "content": f"**Published:** {item['date']}",
                  })

              components.append({
                  "type": 14,
                  "spacing": 1,
              })

              if text:
                  components.append({
                      "type": 10,
                      "content": text,
                  })

              if index == total - 1:
                  components.append({
                      "type": 14,
                      "spacing": 1,
                  })

                  components.append({
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "View Source",
                              "url": item["url"],
   
