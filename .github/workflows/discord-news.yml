name: Discord Docs News

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest Discord Docs commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          response=$(gh api \
            repos/discord/discord-api-docs/commits \
            --method GET \
            -f per_page=1)

          sha=$(echo "$response" | jq -r '.[0].sha')
          message=$(echo "$response" | jq -r '.[0].commit.message' | head -n 1)
          url=$(echo "$response" | jq -r '.[0].html_url')
          author=$(echo "$response" | jq -r '.[0].commit.author.name')
          date=$(echo "$response" | jq -r '.[0].commit.author.date')

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Get changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/discord/discord-api-docs/commits/$SHA" \
            | jq -r '.files[].filename' > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

      - name: Check if already announced
        id: cache
        uses: actions/cache@v4
        with:
          path: .discorddocs
          key: discord-docs-${{ steps.commit.outputs.sha }}

      - name: Classify update
        id: classify
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          message="${{ steps.commit.outputs.message }}"
          files="$(cat changed-files.txt)"

          category="docs"

          if echo "$message $files" | grep -Eiq \
            'breaking|deprecated|deprecat|removed|removal|breaking change'; then
            category="breaking"

          elif echo "$files" | grep -Eiq \
            '^resources/discord-social-sdk/|^developers/discord-social-sdk/'; then
            category="social_sdk"

          elif echo "$files" | grep -Eiq \
            '^developers/change-log\.mdx$'; then
            category="changelog"

          elif echo "$files" | grep -Eiq \
            '^developers/reference|^developers/resources/|^developers/events/|^developers/topics/|^developers/components/'; then
            category="api"

          else
            category="docs"
          fi

          echo "Detected category: $category"
          echo "category=$category" >> "$GITHUB_OUTPUT"

      - name: Send Discord embed
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CATEGORY: ${{ steps.classify.outputs.category }}

          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}

          MESSAGE: ${{ steps.commit.outputs.message }}
          URL: ${{ steps.commit.outputs.url }}
          AUTHOR: ${{ steps.commit.outputs.author }}
          DATE: ${{ steps.commit.outputs.date }}
          SHA: ${{ steps.commit.outputs.sha }}

        shell: bash
        run: |
          set -euo pipefail

          case "$CATEGORY" in
            changelog)
              WEBHOOK="$WEBHOOK_CHANGELOG"
              CATEGORY_NAME="Discord Changelog"
              ;;

            api)
              WEBHOOK="$WEBHOOK_API"
              CATEGORY_NAME="Discord API Update"
              ;;

            social_sdk)
              WEBHOOK="$WEBHOOK_SOCIAL_SDK"
              CATEGORY_NAME="Discord Social SDK"
              ;;

            breaking)
              WEBHOOK="$WEBHOOK_BREAKING"
              CATEGORY_NAME="Breaking Change"
              ;;

            docs)
              WEBHOOK="$WEBHOOK_DOCS"
              CATEGORY_NAME="Discord Documentation"
              ;;

            *)
              WEBHOOK="$WEBHOOK_DOCS"
              CATEGORY_NAME="Discord Documentation"
              ;;
          esac

          if [ -z "$WEBHOOK" ]; then
            echo "Missing webhook for category: $CATEGORY"
            exit 1
          fi

          short_sha="${SHA:0:7}"

          payload=$(jq -n \
            --arg category "$CATEGORY_NAME" \
            --arg message "$MESSAGE" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --arg sha "$short_sha" \
            --arg date "$DATE" \
            '{
              username: "DiscordDocs",
              embeds: [{
                author: {
                  name: "Discord Developer Documentation",
                  url: "https://docs.discord.com/developers"
                },
                title: $message,
                url: $url,
                description: "An official update was published to the Discord Developer Documentation.",
                color: 5793266,
                fields: [
                  {
                    name: "Category",
                    value: $category,
                    inline: true
                  },
                  {
                    name: "Author",
                    value: $author,
                    inline: true
                  },
                  {
                    name: "Commit",
                    value: $sha,
                    inline: true
                  }
                ],
                footer: {
                  text: "Discord Developer Documentation"
                },
                timestamp: $date
              }]
            }')

          echo "Sending Discord notification..."

          response=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK")

          echo "$response"

          status=$(echo "$response" | tail -n 1 | sed 's/HTTP_STATUS://')

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Discord returned HTTP $status"
            exit 1
          fi

          echo "Notification sent successfully."

      - name: Save announced commit
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .discorddocs
          echo "${{ steps.commit.outputs.sha }}" > .discorddocs/latest
