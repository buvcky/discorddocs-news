name: Discord Official News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  discord-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover official updates
        run: |
          cat > discover.py <<'PY'
          import json
          import re
          import urllib.request
          import urllib.error

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "DiscordDocsNews/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          def fetch(url):
              try:
                  return get(url)
              except Exception as e:
                  print(f"Fetch failed: {url} -> {e}")
                  return ""

          def clean_html(text):
              text = re.sub(r"<script.*?</script>", "", text, flags=re.S | re.I)
              text = re.sub(r"<style.*?</style>", "", text, flags=re.S | re.I)
              text = re.sub(r"<[^>]+>", " ", text)
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def first_match(pattern, text):
              m = re.search(pattern, text, re.I)
              return m.group(1).strip() if m else ""

          sources = {}

          blog = fetch("https://discord.com/blog")
          patch = fetch("https://discord.com/tags/patch-notes")
          newsletter = fetch(
              "https://discord.com/developers/developer-newsletter"
          )

          blog_text = clean_html(blog)
          patch_text = clean_html(patch)
          newsletter_text = clean_html(newsletter)

          changelog_urls = re.findall(
              r'https://discord\.com/blog/discord-update-[^"\'<>\s]+',
              blog
          )

          if changelog_urls:
              url = changelog_urls[0].rstrip(".,)")
              page = clean_html(fetch(url))

              title = first_match(
                  r"<title[^>]*>(.*?)</title>",
                  fetch(url)
              )

              if not title:
                  title = "Discord Update"

              title = re.sub(
                  r"\s*[|–-]\s*Discord.*$",
                  "",
                  title,
                  flags=re.I
              ).strip()

              description = page[:1600]

              sources["changelog"] = {
                  "found": True,
                  "title": title[:250],
                  "description": description,
                  "source": "Discord Blog",
                  "type": "Changelog",
                  "url": url
              }
          else:
              sources["changelog"] = {"found": False}

          patch_urls = re.findall(
              r'https://discord\.com/blog/discord-patch-notes-[^"\'<>\s]+',
              patch
          )

          if patch_urls:
              url = patch_urls[0].rstrip(".,)")
              page_raw = fetch(url)
              page = clean_html(page_raw)

              title = first_match(
                  r"<title[^>]*>(.*?)</title>",
                  page_raw
              )

              if not title:
                  title = "Discord Patch Notes"

              title = re.sub(
                  r"\s*[|–-]\s*Discord.*$",
                  "",
                  title,
                  flags=re.I
              ).strip()

              sources["patch_notes"] = {
                  "found": True,
                  "title": title[:250],
                  "description": page[:1600],
                  "source": "Discord Patch Notes",
                  "type": "Patch Notes",
                  "url": url
              }
          else:
              sources["patch_notes"] = {"found": False}

          newsletter_urls = re.findall(
              r'https://discord\.com/developer-newsletter/[^"\'<>\s]+',
              newsletter
          )

          if newsletter_urls:
              url = newsletter_urls[0].rstrip(".,)")
              page_raw = fetch(url)
              page = clean_html(page_raw)

              title = first_match(
                  r"<title[^>]*>(.*?)</title>",
                  page_raw
              )

              if not title:
                  title = "Discord Developer Newsletter"

              title = re.sub(
                  r"\s*[|–-]\s*Discord.*$",
                  "",
                  title,
                  flags=re.I
              ).strip()

              sources["developer_news"] = {
                  "found": True,
                  "title": title[:250],
                  "description": page[:1600],
                  "source": "Discord Developer Newsletter",
                  "type": "Developer News",
                  "url": url
              }
          else:
              sources["developer_news"] = {"found": False}

          github_api = fetch(
              "https://api.github.com/repos/discord/discord-api-docs/commits?per_page=1"
          )

          try:
              commits = json.loads(github_api)
          except Exception:
              commits = []

          if commits:
              commit = commits[0]
              sha = commit.get("sha", "")
              commit_data = commit.get("commit", {})
              message = commit_data.get("message", "")
              author = (
                  commit_data.get("author", {})
                  .get("name", "Discord")
              )

              commit_url = (
                  f"https://github.com/discord/discord-api-docs/commit/{sha}"
              )

              detail_raw = fetch(
                  f"https://api.github.com/repos/discord/discord-api-docs/commits/{sha}"
              )

              try:
                  detail = json.loads(detail_raw)
              except Exception:
                  detail = {}

              files = detail.get("files", [])
              filenames = [
                  f.get("filename", "")
                  for f in files
              ]

              combined = (
                  message
                  + "\n"
                  + "\n".join(filenames)
              ).lower()

              breaking_terms = [
                  "breaking",
                  "deprecated",
                  "deprecation",
                  "removal",
                  "removed",
                  "remove",
                  "obsolete"
              ]

              is_breaking = any(
                  term in combined
                  for term in breaking_terms
              )

              is_social_sdk = any(
                  path.startswith(
                      (
                          "resources/discord-social-sdk/",
                          "developers/discord-social-sdk/"
                      )
                  )
                  for path in filenames
              )

              is_api = any(
                  (
                      path == "developers/reference.mdx"
                      or path.startswith("developers/reference/")
                      or path.startswith("developers/resources/")
                      or path.startswith("developers/events/")
                      or path.startswith("developers/topics/")
                      or path.startswith("developers/components/")
                      or path == "developers/change-log.mdx"
                  )
                  for path in filenames
              )

              if is_breaking:
                  category = "breaking"
                  item_type = "Breaking Change"
                  source_name = "Discord API Docs"
              elif is_social_sdk:
                  category = "social_sdk"
                  item_type = "Social SDK"
                  source_name = "Discord API Docs"
              elif is_api:
                  category = "api"
                  item_type = "API Update"
                  source_name = "Discord API Docs"
              else:
                  category = "docs"
                  item_type = "Documentation Update"
                  source_name = "Discord API Docs"

              description = message.strip()

              if not description:
                  description = "A new official Discord API documentation update was published."

              file_text = "\n".join(filenames[:20])

              sources[category] = {
                  "found": True,
                  "title": message.splitlines()[0][:250],
                  "description": description[:1600],
                  "source": source_name,
                  "type": item_type,
                  "url": commit_url,
                  "author": author,
                  "commit": sha[:12],
                  "files": file_text
              }

          for category in [
              "api",
              "docs",
              "social_sdk",
              "breaking"
          ]:
              if category not in sources:
                  sources[category] = {
                      "found": False
                  }

          with open(
              "sources.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(
              sources,
              ensure_ascii=False,
              indent=2
          ))
          PY

          python3 discover.py

      - name: Create Components V2 sender
        run: |
          cat > send.py <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          category = sys.argv[1]
          webhook = os.environ["WEBHOOK_URL"]

          with open("sources.json", "r", encoding="utf-8") as f:
              sources = json.load(f)

          item = sources.get(category)

          if not item or not item.get("found"):
              print(f"No update for {category}")
              sys.exit(0)

          title = item.get(
              "title",
              "Official Discord Update"
          )[:250]

          description = item.get(
              "description",
              "An official update was published by Discord."
          )[:1600]

          source = item.get(
              "source",
              "Discord"
          )

          item_type = item.get(
              "type",
              category
          )

          url = item.get("url", "")

          info = (
              f"**Source**\n"
              f"{source}\n\n"
              f"**Type**\n"
              f"{item_type}"
          )

          if item.get("author"):
              info += (
                  f"\n\n**Author**\n"
                  f"{item['author']}"
              )

          if item.get("commit"):
              info += (
                  f"\n\n**Commit**\n"
                  f"`{item['commit']}`"
              )

          if item.get("files"):
              info += (
                  f"\n\n**Changed Files**\n"
                  f"```text\n"
                  f"{item['files'][:700]}"
                  f"\n```"
              )

          components = [
              {
                  "type": 10,
                  "content": (
                      f"# {title}\n\n"
                      f"{description}"
                  )
              },
              {
                  "type": 14,
                  "divider": True,
                  "spacing": 1
              },
              {
                  "type": 10,
                  "content": info[:1800]
              },
              {
                  "type": 14,
                  "divider": True,
                  "spacing": 1
              },
              {
                  "type": 1,
                  "components": [
                      {
                          "type": 2,
                          "style": 5,
                          "label": "Open Official Update",
                          "url": url
                      }
                  ]
              }
          ]

          usernames = {
              "changelog": "Changelog Updates",
              "patch_notes": "Patch Notes",
              "developer_news": "Developer News",
              "api": "API Updates",
              "docs": "Docs Updates",
              "social_sdk": "Social SDK",
              "breaking": "Breaking Changes"
          }

          payload = {
              "username": usernames.get(
                  category,
                  "Docs Updates"
              ),
              "flags": 32768,
              "components": components
          }

          separator = "&" if "?" in webhook else "?"

          endpoint = (
              webhook
              + separator
              + "with_components=true"
              + "&wait=true"
          )

          body = json.dumps(
              payload,
              ensure_ascii=False,
              separators=(",", ":")
          ).encode("utf-8")

          print("Sending Components V2...")
          print("Category:", category)
          print("Title:", title)

          request = urllib.request.Request(
              endpoint,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordDocsNews/1.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  result = response.read().decode(
                      "utf-8",
                      "ignore"
                  )

                  print(
                      f"{category}: HTTP {response.status}"
                  )

                  if result:
                      print(result)

          except urllib.error.HTTPError as e:
              result = e.read().decode(
                  "utf-8",
                  "ignore"
              )

              print(
                  f"{category}: HTTP {e.code}"
              )

              print(result)
              sys.exit(1)
          PY

      - name: Send Changelog
        if: ${{ hashFiles('.state-changelog') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_CHANGELOG }}
        run: |
          python3 send.py changelog
          touch .state-changelog

      - name: Send Patch Notes
        if: ${{ hashFiles('.state-patch-notes') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_PATCH_NOTES }}
        run: |
          python3 send.py patch_notes
          touch .state-patch-notes

      - name: Send Developer News
        if: ${{ hashFiles('.state-developer-news') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
        run: |
          python3 send.py developer_news
          touch .state-developer-news

      - name: Send API Updates
        if: ${{ hashFiles('.state-api') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_API }}
        run: |
          python3 send.py api
          touch .state-api

      - name: Send Docs Updates
        if: ${{ hashFiles('.state-docs') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_DOCS }}
        run: |
          python3 send.py docs
          touch .state-docs

      - name: Send Social SDK
        if: ${{ hashFiles('.state-social-sdk') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          python3 send.py social_sdk
          touch .state-social-sdk

      - name: Send Breaking Changes
        if: ${{ hashFiles('.state-breaking') == '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_BREAKING }}
        run: |
          python3 send.py breaking
          touch .state-breaking
