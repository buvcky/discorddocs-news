name: Discord News Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discord-news
  cancel-in-progress: false

jobs:
  discord-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Restore update state
        uses: actions/cache@v6
        with:
          path: .discord-state
          key: discord-news-state-${{ github.run_id }}
          restore-keys: |
            discord-news-state-

      - name: Fetch sources and send updates
        env:
          WEBHOOK_API: ${{ secrets.WEBHOOK_API }}
          WEBHOOK_BREAKING: ${{ secrets.WEBHOOK_BREAKING }}
          WEBHOOK_CHANGELOG: ${{ secrets.WEBHOOK_CHANGELOG }}
          WEBHOOK_DEVELOPER_NEWS: ${{ secrets.WEBHOOK_DEVELOPER_NEWS }}
          WEBHOOK_DOCS: ${{ secrets.WEBHOOK_DOCS }}
          WEBHOOK_PATCH_NOTES: ${{ secrets.WEBHOOK_PATCH_NOTES }}
          WEBHOOK_SOCIAL_SDK: ${{ secrets.WEBHOOK_SOCIAL_SDK }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.parse
          import urllib.error
          from pathlib import Path
          from html import unescape
          from html.parser import HTMLParser

          STATE_DIR = Path(".discord-state")
          STATE_DIR.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (DiscordDocsNews/2.0)",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          CHANGELOG_RAW = (
              "https://raw.githubusercontent.com/"
              "discord/discord-api-docs/main/docs/change-log.mdx"
          )

          CHANGELOG_PAGE = "https://discord.com/developers/docs/change-log"

          SOURCES = {
              "patch_notes": {
                  "webhook": "WEBHOOK_PATCH_NOTES",
                  "tag_url": "https://discord.com/tags/patch-notes",
                  "match": lambda title: "patch notes" in title.lower(),
              },

              "changelog": {
                  "webhook": "WEBHOOK_CHANGELOG",
                  "tag_url": "https://discord.com/tags/changelog",
                  "match": lambda title: "changelog" in title.lower(),
              },

              "developer_news": {
                  "webhook": "WEBHOOK_DEVELOPER_NEWS",
                  "tag_url": "https://discord.com/developers/developer-newsletter",
                  "match": lambda title: True,
              },
          }


          def fetch(url):
              request = urllib.request.Request(url, headers=HEADERS)

              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP {error.code} while fetching {url}: {body[:500]}"
                  )


          def absolute_url(base, value):
              if not value:
                  return ""
              return urllib.parse.urljoin(base, value)


          def clean_text(value):
              value = unescape(value or "")
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.current_href = None
                  self.current_text = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      attributes = dict(attrs)
                      self.current_href = attributes.get("href")
                      self.current_text = []

              def handle_data(self, data):
                  if self.current_href is not None:
                      self.current_text.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.current_href is not None:
                      text = clean_text(" ".join(self.current_text))

                      if self.current_href and text:
                          self.links.append(
                              (self.current_href, text)
                          )

                      self.current_href = None
                      self.current_text = []


          def extract_links(html, base):
              parser = LinkParser()
              parser.feed(html)

              result = []

              for href, title in parser.links:
                  result.append(
                      (
                          absolute_url(base, href),
                          title
                      )
                  )

              return result


          class ArticleParser(HTMLParser):
              BLOCK_TAGS = {
                  "h1",
                  "h2",
                  "h3",
                  "h4",
                  "h5",
                  "h6",
                  "p",
                  "li",
                  "blockquote",
                  "pre",
              }

              def __init__(self):
                  super().__init__()

                  self.article_depth = 0
                  self.main_depth = 0

                  self.article_blocks = []
                  self.main_blocks = []

                  self.article_images = []
                  self.main_images = []

                  self.current_tag = None
                  self.current_buffer = []
                  self.current_depth = 0

                  self.list_depth = 0

              def in_article(self):
                  return self.article_depth > 0

              def in_main(self):
                  return self.main_depth > 0

              def target(self):
                  if self.in_article():
                      return "article"

                  if self.in_main():
                      return "main"

                  return None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attributes = dict(attrs)

                  if tag == "article":
                      self.article_depth += 1

                  if tag == "main":
                      self.main_depth += 1

                  if tag == "li":
                      self.list_depth += 1

                  if tag == "img":
                      src = (
                          attributes.get("src")
                          or attributes.get("data-src")
                          or attributes.get("data-lazy-src")
                      )

                      alt = clean_text(attributes.get("alt", ""))

                      if src and self.target():
                          item = {
                              "url": src,
                              "alt": alt
                          }

                          target = (
                              self.article_images
                              if self.in_article()
                              else self.main_images
                          )

                          target.append(item)

                  if tag in self.BLOCK_TAGS:
                      if self.current_tag is None:
                          self.current_tag = tag
                          self.current_buffer = []
                          self.current_depth = 1
                      else:
                          self.current_depth += 1

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  self.handle_endtag(tag)

              def handle_data(self, data):
                  if self.current_tag is not None:
                      self.current_buffer.append(data)

              def handle_endtag(self, tag):
                  tag = tag.lower()

                  if tag in self.BLOCK_TAGS and self.current_tag is not None:
                      if self.current_depth > 1:
                          self.current_depth -= 1
                      else:
                          text = clean_text(
                              " ".join(self.current_buffer)
                          )

                          if text:
                              if self.in_article():
                                  self.article_blocks.append(
                                      (self.current_tag, text)
                                  )
                              elif self.in_main():
                                  self.main_blocks.append(
                                      (self.current_tag, text)
                                  )

                          self.current_tag = None
                          self.current_buffer = []
                          self.current_depth = 0

                  if tag == "li":
                      self.list_depth = max(0, self.list_depth - 1)

                  if tag == "article":
                      self.article_depth = max(
                          0,
                          self.article_depth - 1
                      )

                  if tag == "main":
                      self.main_depth = max(
                          0,
                          self.main_depth - 1
                      )


          def extract_article(url):
              html = fetch(url)

              parser = ArticleParser()
              parser.feed(html)

              blocks = (
                  parser.article_blocks
                  if parser.article_blocks
                  else parser.main_blocks
              )

              images = (
                  parser.article_images
                  if parser.article_blocks
                  else parser.main_images
              )

              title = ""

              for tag, text in blocks:
                  if tag == "h1":
                      title = text
                      break

              if not title:
                  title = "Discord Update"

              date_match = re.search(
                  r"\b(?:January|February|March|April|May|June|"
                  r"July|August|September|October|November|December)"
                  r"\s+\d{1,2},\s+20\d{2}\b",
                  html
              )

              date = (
                  date_match.group(0)
                  if date_match
                  else ""
              )

              output = []

              seen = set()

              for tag, text in blocks:
                  if text in seen:
                      continue

                  seen.add(text)

                  if text == title:
                      continue

                  if date and text == date:
                      continue

                  if tag.startswith("h"):
                      output.append(f"## {text}")

                  elif tag == "li":
                      output.append(f"- {text}")

                  elif tag == "blockquote":
                      output.append(f"> {text}")

                  else:
                      output.append(text)

              content = "\n\n".join(output)

              content = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  content
              ).strip()

              image_urls = []

              for image in images:
                  image_url = absolute_url(url, image["url"])

                  if not image_url:
                      continue

                  if image_url.startswith("data:"):
                      continue

                  if image_url in image_urls:
                      continue

                  low = image_url.lower()

                  if low.endswith(".svg"):
                      continue

                  image_urls.append(image_url)

                  if len(image_urls) >= 4:
                      break

              return {
                  "title": title,
                  "date": date,
                  "url": url,
                  "content": content,
                  "images": image_urls,
              }


          def find_latest_tag_article(tag_url, matcher):
              html = fetch(tag_url)

              links = extract_links(
                  html,
                  tag_url
              )

              for url, title in links:
                  if not url.startswith("https://discord.com/"):
                      continue

                  if "/blog/" not in url:
                      continue

                  if matcher(title):
                      return extract_article(url)

              return None


          def find_latest_newsletter():
              html = fetch(
                  "https://discord.com/developers/developer-newsletter"
              )

              links = extract_links(
                  html,
                  "https://discord.com/developers/developer-newsletter"
              )

              for url, title in links:
                  if "/developer-newsletter/" in url:
                      return extract_article(url)

              return None


          def parse_changelog():
              mdx = fetch(CHANGELOG_RAW)

              pattern = re.compile(
                  r'<Update\b'
                  r'(?=[^>]*\blabel="([^"]+)")'
                  r'(?=[^>]*\btags=\{\[([^\]]*)\]\})'
                  r'[^>]*>'
                  r'(.*?)'
                  r'</Update>',
                  re.I | re.S
              )

              entries = []

              for match in pattern.finditer(mdx):
                  date = match.group(1).strip()

                  tags_raw = match.group(2)

                  tags = re.findall(
                      r'"([^"]+)"',
                      tags_raw
                  )

                  body = match.group(3).strip()

                  if not body:
                      continue

                  entries.append({
                      "date": date,
                      "tags": tags,
                      "body": body,
                  })

              return entries


          def clean_mdx(text):
              text = re.sub(
                  r"<!--.*?-->",
                  "",
                  text,
                  flags=re.S
              )

              text = re.sub(
                  r"^\s*import .*?$",
                  "",
                  text,
                  flags=re.M
              )

              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )

              def fix_link(match):
                  label = match.group(1)
                  url = match.group(2)

                  if url.startswith("/"):
                      url = "https://discord.com" + url

                  return f"[{label}]({url})"

              text = re.sub(
                  r"\[([^\]]+)\]\(([^)]+)\)",
                  fix_link,
                  text
              )

              text = re.sub(
                  r"!\[([^\]]*)\]\(([^)]+)\)",
                  "",
                  text
              )

              text = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  text
              )

              return text.strip()


          def changelog_entry(entry):
              body = clean_mdx(entry["body"])

              title = ""

              for line in body.splitlines():
                  line = line.strip()

                  if line.startswith("## "):
                      title = line[3:].strip()
                      break

              if not title:
                  title = "Discord Developer Changelog"

              return {
                  "title": title,
                  "date": entry["date"],
                  "url": CHANGELOG_PAGE,
                  "content": body,
                  "images": [],
              }


          def find_changelog_category(entries, category):
              for entry in entries:
                  tags = {
                      tag.lower()
                      for tag in entry["tags"]
                  }

                  if category == "api":
                      if (
                          "http api" in tags
                          or "interactions" in tags
                      ):
                          return changelog_entry(entry)

                  elif category == "social_sdk":
                      if "discord social sdk" in tags:
                          return changelog_entry(entry)

                  elif category == "breaking":
                      if "breaking change" in tags:
                          return changelog_entry(entry)

                  elif category == "docs":
                      if (
                          "documentation" in tags
                          or "docs" in tags
                          or "documentation changes" in tags
                      ):
                          return changelog_entry(entry)

              return None


          def make_id(item):
              raw = (
                  item["url"]
                  + "|"
                  + item["title"]
                  + "|"
                  + item.get("date", "")
                  + "|"
                  + item.get("content", "")
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          def state_file(category):
              return STATE_DIR / f"{category}.state"


          def read_state(category):
              path = state_file(category)

              if not path.exists():
                  return ""

              return path.read_text(
                  encoding="utf-8"
              ).strip()


          def write_state(category, value):
              state_file(category).write_text(
                  value,
                  encoding="utf-8"
              )


          def split_content(text, limit=3500):
              paragraphs = text.split("\n\n")

              chunks = []
              current = ""

              for paragraph in paragraphs:
                  paragraph = paragraph.strip()

                  if not paragraph:
                      continue

                  candidate = (
                      paragraph
                      if not current
                      else current + "\n\n" + paragraph
                  )

                  if len(candidate) <= limit:
                      current = candidate
                      continue

                  if current:
                      chunks.append(current)

                  if len(paragraph) <= limit:
                      current = paragraph
                      continue

                  while len(paragraph) > limit:
                      cut = paragraph.rfind(
                          "\n",
                          0,
                          limit
                      )

                      if cut < 1000:
                          cut = paragraph.rfind(
                              " ",
                              0,
                              limit
                          )

                      if cut < 1000:
                          cut = limit

                      chunks.append(
                          paragraph[:cut].strip()
                      )

                      paragraph = paragraph[cut:].strip()

                  current = paragraph

              if current:
                  chunks.append(current)

              return chunks or [""]


          def media_component(images):
              if not images:
                  return None

              items = []

              for url in images:
                  items.append({
                      "type": 1,
                      "media": {
                          "url": url
                      }
                  })

              return {
                  "type": 
